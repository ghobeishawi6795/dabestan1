<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بانک سوالات</title>
<link rel="stylesheet" href="shared.css">
<style>
body{font-family:Vazirmatn,sans-serif;padding:20px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;cursor:pointer}
.tab.active{background:#6C5CE7;color:#fff;border-color:#6C5CE7}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:8px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:inherit}
.submit-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#6C5CE7;color:#fff;font-weight:700;cursor:pointer}
.question-item{background:#fff;border:2px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:12px}
.question-header{display:flex;justify-content:space-between;margin-bottom:8px}
.question-meta{font-size:12px;color:#888}
.btn-small{padding:8px 16px;border:none;border-radius:8px;margin-right:8px;cursor:pointer}
.btn-preview{background:#e0e7ff;color:#6C5CE7}
.btn-delete{background:#fee;color:#c00}
.result{margin-top:16px;padding:12px;border-radius:10px}
.result.success{background:#d4edda;color:#155724}
.result.error{background:#f8d7da;color:#721c24}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<h1>بانک سوالات</h1>
<div class="tabs">
<button class="tab active" onclick="showTab('upload')">آپلود سوال</button>
<button class="tab" onclick="showTab('list')">لیست سوالات</button>
</div>
<div id="uploadTab" class="card">
<form id="uploadForm">
<div class="field"><label>عنوان</label><input type="text" id="title" required></div>
<div class="row">
<div class="field"><label>درس</label><select id="subject"><option value="">-</option><option>ریاضی</option><option>فارسی</option><option>علوم</option></select></div>
<div class="field"><label>پایه</label><select id="grade"><option value="">-</option><option value="1">اول</option><option value="2">دوم</option><option value="3">سوم</option></select></div>
</div>
<div class="field"><label>سوال (HTML)</label><textarea id="html" rows="6" required></textarea></div>
<button class="submit-btn">آپلود</button>
</form>
<div id="result"></div>
</div>
<div id="listTab" style="display:none"><div id="questionsList"></div></div>
<script>
const user=JSON.parse(localStorage.getItem('user')||'{}');
const teacherId=user.id||1;
function showTab(t){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.getElementById('uploadTab').style.display=t==='upload'?'block':'none';
document.getElementById('listTab').style.display=t==='list'?'block':'none';
event.target.classList.add('active');
if(t==='list')loadQuestions();
}
document.getElementById('uploadForm').onsubmit=async function(e){
e.preventDefault();
const btn=this.querySelector('.submit-btn');
const resDiv=document.getElementById('result');
btn.disabled=true;btn.textContent='در حال آپلود...';
try{
const res=await fetch('/api/teacher/upload-question',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
teacherId,title:document.getElementById('title').value,
subject:document.getElementById('subject').value||null,
grade:document.getElementById('grade').value||null,
questionHtml:document.getElementById('html').value,
questionType:'html'
})
});
const data=await res.json();
resDiv.className='result '+(data.success?'success':'error');
resDiv.textContent=(data.success?'✅':'❌ ')+data.message;
if(data.success)this.reset();
}catch(err){
resDiv.className='result error';resDiv.textContent=' خطا';
}
btn.disabled=false;btn.textContent='آپلود';
};
async function loadQuestions(){
const list=document.getElementById('questionsList');
try{
const res=await fetch('/api/teacher/get-questions?teacherId='+teacherId);
const data=await res.json();
if(data.success&&data.questions.length>0){
list.innerHTML=data.questions.map(q=>'<div class="question-item"><div class="question-header"><strong>'+q.title+'</strong></div><div class="question-meta">'+(q.subject||'-')+' | پایه '+(q.grade||'-')+'</div><button class="btn-small btn-preview" onclick="alert(\''+q.question_html.replace(/'/g,"\\'")+'\')">پیش‌نمایش</button></div>').join('');
}else list.innerHTML='<p>سوالی یافت نشد</p>';
}catch(err){list.innerHTML='<p>خطا</p>';}
}
</script>
</body>
</html>
