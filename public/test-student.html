<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>تست</title></head>
<body>
<h1>تست API</h1>
<button onclick="test()">تست بدون کلاس</button>
<div id="result"></div>
<script>
async function test() {
  const r = document.getElementById('result');
  try {
    const res = await fetch('/api/teacher/add-student', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teacherId: 2, studentName: 'علی', phone: '09121111111', className: null, grade: null })
    });
    r.innerHTML = await res.text();
  } catch(e) { r.innerHTML = e.message; }
}
</script>
</body></html>
