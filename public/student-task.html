<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>دبستان — انجام تکلیف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .phone{padding-bottom:100px;}
  
  .header{
    padding:18px 20px 14px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--bg);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .2s var(--ease);
    text-decoration:none;
    color:var(--text);
  }
  .back-btn:hover{background:var(--primary-soft);}
  .back-btn svg{
    width:20px;
    height:20px;
    transform:scaleX(-1);
  }
  .header-info{flex:1;}
  .header-title{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .header-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
  }
  .deadline-badge{
    background:var(--warning-soft);
    color:#B45309;
    font-size:11px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:4px;
  }

  .task-card{
    margin:16px 20px;
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-sm);
    animation:fadeUp .4s var(--ease) both;
  }
  .task-icon{
    width:56px;
    height:56px;
    border-radius:18px;
    background:var(--info-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    margin-bottom:14px;
  }
  .task-title{
    font-size:17px;
    font-weight:800;
    margin:0 0 6px;
  }
  .task-desc{
    font-size:13px;
    color:var(--text-2);
    margin:0 0 14px;
    line-height:1.8;
  }
  .task-meta{
    display:flex;
    gap:12px;
    font-size:11px;
    color:var(--muted);
  }
  .task-meta span{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .task-meta svg{
    width:14px;
    height:14px;
  }

  .attachment{
    margin-top:14px;
    background:var(--primary-soft);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    transition:all .2s var(--ease);
  }
  .attachment:hover{
    background:var(--primary);
    color:#fff;
  }
  .attachment:hover .att-name{color:#fff;}
  .attachment:hover .att-size{color:rgba(255,255,255,.8);}
  .att-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
  }
  .att-info{flex:1;}
  .att-name{
    font-size:13px;
    font-weight:700;
    color:var(--primary);
    transition:color .2s var(--ease);
  }
  .att-size{
    font-size:11px;
    color:var(--muted);
    transition:color .2s var(--ease);
  }

  .response-form{
    margin:20px;
    animation:fadeUp .4s var(--ease) .1s both;
  }
  .response-label{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .response-tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .response-tabs::-webkit-scrollbar{display:none;}
  .response-tab{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    background:var(--card);
    color:var(--text-2);
    border:1.5px solid var(--border);
    cursor:pointer;
    transition:all .2s var(--ease);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .response-tab.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .response-tab .emoji{font-size:16px;}

  .response-field{
    display:none;
  }
  .response-field.active{
    display:block;
    animation:fadeUp .3s var(--ease) both;
  }

  .textarea{
    width:100%;
    min-height:140px;
    padding:14px;
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    background:var(--card);
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    resize:vertical;
    transition:all .2s var(--ease);
  }
  .textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
  }
  .textarea::placeholder{color:var(--muted);}

  .upload-area{
    background:var(--card);
    border:2px dashed var(--border);
    border-radius:var(--radius);
    padding:32px 20px;
    text-align:center;
    cursor:pointer;
    transition:all .2s var(--ease);
  }
  .upload-area:hover{
    border-color:var(--primary);
    background:var(--primary-soft);
  }
  .upload-icon{
    width:64px;
    height:64px;
    margin:0 auto 12px;
    border-radius:50%;
    background:var(--primary-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
  }
  .upload-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:4px;
  }
  .upload-desc{
    font-size:12px;
    color:var(--muted);
  }

  .audio-recorder{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
    box-shadow:var(--shadow-sm);
  }
  .record-btn{
    width:72px;
    height:72px;
    margin:0 auto 14px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--primary),#8B7CF6);
    color:#fff;
    border:none;
    font-size:32px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(108,92,231,.3);
    transition:all .2s var(--ease);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .record-btn:hover{
    transform:scale(1.05);
    box-shadow:0 12px 32px rgba(108,92,231,.4);
  }
  .record-btn:active{
    transform:scale(.95);
  }
  .record-btn.recording{
    background:var(--danger);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5);}
    50%{box-shadow:0 0 0 16px rgba(239,68,68,0);}
  }
  .record-status{
    font-size:13px;
    font-weight:600;
    color:var(--text-2);
    margin-bottom:8px;
  }
  .record-timer{
    font-size:24px;
    font-weight:800;
    color:var(--primary);
    font-variant-numeric:tabular-nums;
  }

  .file-upload{
    background:var(--card);
    border:2px dashed var(--border);
    border-radius:var(--radius);
    padding:28px 20px;
    text-align:center;
    cursor:pointer;
    transition:all .2s var(--ease);
  }
  .file-upload:hover{
    border-color:var(--primary);
    background:var(--primary-soft);
  }
  .file-icon{
    width:56px;
    height:56px;
    margin:0 auto 12px;
    border-radius:50%;
    background:var(--primary-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
  }

  .submit-wrap{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    padding:16px 20px;
    background:var(--card);
    border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(30,30,60,.06);
  }

  .success-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.95);
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s var(--ease);
  }
  .success-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .success-icon{
    width:120px;
    height:120px;
    border-radius:50%;
    background:var(--success-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:64px;
    margin-bottom:24px;
    animation:popIn .5s var(--ease) both;
  }
  .success-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:8px;
    animation:fadeUp .4s var(--ease) .2s both;
  }
  .success-desc{
    font-size:14px;
    color:var(--text-2);
    text-align:center;
    max-width:280px;
    animation:fadeUp .4s var(--ease) .3s both;
  }

  @keyframes popIn{
    from{opacity:0; transform:scale(.5);}
    to{opacity:1; transform:scale(1);}
  }
</style>
</head>
<body>

<div class="phone">

  <header class="header">
    <div class="header-row">
      <a href="student-home.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="header-info">
        <h1 class="header-title" id="taskTitle">در حال بارگذاری...</h1>
        <div class="header-sub" id="taskSub"></div>
      </div>
      <div class="deadline-badge" id="deadlineBadge" style="display:none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="deadlineText"></span>
      </div>
    </div>
  </header>

  <div class="task-card">
    <div class="task-icon">📘</div>
    <h2 class="task-title" id="taskTitle2">—</h2>
    <p class="task-desc" id="taskDesc"></p>
    <div class="task-meta">
      <span id="feedbackBanner" style="display:none; color:var(--primary); font-weight:700;"></span>
    </div>
  </div>

  <div class="response-form">
    <div class="response-label">
      ✍️ پاسخ خود را وارد کن
    </div>

    <div class="response-tabs">
      <div class="response-tab active" data-type="text">
        <span class="emoji">📝</span>
        پاسخ متنی
      </div>
      <div class="response-tab" data-type="image">
        <span class="emoji">📷</span>
        عکس از مشق
      </div>
      <div class="response-tab" data-type="file">
        <span class="emoji">📁</span>
        آپلود فایل
      </div>
    </div>

    <div class="response-field active" data-field="text">
      <textarea class="textarea" id="answerText" placeholder="جواب‌ها را اینجا بنویس..."></textarea>
    </div>

    <div class="response-field" data-field="image">
      <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        <div class="upload-icon">📷</div>
        <div class="upload-title" id="imageFileName">عکس بگیر یا از گالری انتخاب کن</div>
        <div class="upload-desc">عکس مشق‌هایت را اینجا بفرست</div>
      </div>
      <input type="file" id="imageInput" accept="image/*" style="display:none;" />
    </div>

    <div class="response-field" data-field="file">
      <div class="file-upload" onclick="document.getElementById('fileInput').click()">
        <div class="file-icon">📎</div>
        <div class="upload-title" id="fileFileName">فایل خود را انتخاب کن</div>
        <div class="upload-desc">حداکثر ~۱ مگابایت</div>
      </div>
      <input type="file" id="fileInput" style="display:none;" />
    </div>

  </div>

  <div class="submit-wrap">
    <button class="btn btn-primary" id="submitBtn">
      📤 ارسال تکلیف
    </button>
  </div>

</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-icon">🎉</div>
  <div class="success-title">آفرین!</div>
  <div class="success-desc">تکلیفت با موفقیت ارسال شد. حالا منتظر بازخورد معلم باش!</div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!user.id || user.role !== 'student') {
    window.location.href = 'login.html?role=student';
  }

  const urlParams = new URLSearchParams(window.location.search);
  const taskId = urlParams.get('taskId');
  if (!taskId) {
    window.location.href = 'student-home.html';
  }

  let pendingFile = null; // { dataUrl, type: 'image'|'file', name }

  document.querySelectorAll('.response-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      const type = tab.dataset.type;
      document.querySelectorAll('.response-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.response-field').forEach(f=>{
        f.classList.toggle('active',f.dataset.field === type);
      });
    });
  });

  function readFileAsDataUrl(file, labelElId, type) {
    if (!file) return;
    if (file.size > 1_000_000) {
      alert('حجم فایل باید کمتر از ۱ مگابایت باشد');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingFile = { dataUrl: reader.result, type, name: file.name };
      document.getElementById(labelElId).textContent = '✅ ' + file.name;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('imageInput').addEventListener('change', (e) => {
    readFileAsDataUrl(e.target.files[0], 'imageFileName', 'image');
  });
  document.getElementById('fileInput').addEventListener('change', (e) => {
    readFileAsDataUrl(e.target.files[0], 'fileFileName', 'file');
  });

  async function loadTask() {
    try {
      const res = await fetch(`/api/student/get-task?studentId=${user.id}&taskId=${taskId}`);
      const data = await res.json();

      if (!data.success) {
        alert(data.message || 'تکلیف یافت نشد');
        window.location.href = 'student-home.html';
        return;
      }

      const task = data.task;
      document.getElementById('taskTitle').textContent = task.title;
      document.getElementById('taskTitle2').textContent = task.title;
      document.getElementById('taskSub').textContent = `${task.subject || ''} • ${task.class_name || ''}`;
      document.getElementById('taskDesc').textContent = task.description || '';

      if (task.deadline) {
        document.getElementById('deadlineBadge').style.display = 'flex';
        document.getElementById('deadlineText').textContent = new Date(task.deadline).toLocaleString('fa-IR');
      }

      if (data.submission) {
        document.getElementById('answerText').value = data.submission.answer_text || '';
        if (data.submission.status === 'revision' && data.submission.feedback) {
          const banner = document.getElementById('feedbackBanner');
          banner.style.display = 'inline';
          banner.textContent = '↩️ بازخورد معلم: ' + data.submission.feedback;
        } else if (data.submission.status === 'reviewed') {
          const banner = document.getElementById('feedbackBanner');
          banner.style.display = 'inline';
          banner.textContent = '✅ نمره: ' + (data.submission.score ?? '-') + (data.submission.feedback ? ' • ' + data.submission.feedback : '');
        }
      }
    } catch (err) {
      alert('خطا در بارگذاری تکلیف');
    }
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const answerText = document.getElementById('answerText').value.trim();

    if (!answerText && !pendingFile) {
      alert('لطفاً یک پاسخ بنویس یا فایلی انتخاب کن');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'در حال ارسال...';

    try {
      const res = await fetch('/api/student/submit-task', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentId: user.id,
          taskId: taskId,
          answerText: answerText || null,
          answerFile: pendingFile ? pendingFile.dataUrl : null,
          answerFileType: pendingFile ? pendingFile.type : null
        })
      });
      const data = await res.json();

      if (data.success) {
        const success = document.getElementById('successOverlay');
        success.classList.add('show');
        setTimeout(()=>{
          window.location.href = 'student-home.html';
        },2000);
      } else {
        alert('❌ ' + data.message);
        btn.disabled = false;
        btn.textContent = '📤 ارسال تکلیف';
      }
    } catch (err) {
      alert('خطا در ارتباط با سرور');
      btn.disabled = false;
      btn.textContent = '📤 ارسال تکلیف';
    }
  });

  loadTask();
</script>

</body>
</html>
