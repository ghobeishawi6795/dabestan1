<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات تکلیف - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 24px; min-height: 100%; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .back-btn:hover { border-color: var(--primary); transform: translateX(4px); }
  .back-btn svg { width: 20px; height: 20px; color: var(--text-2); }
  .page-title { flex: 1; }
  .page-title h1 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .page-title p { margin: 0; font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  
  .task-info { margin-bottom: 20px; }
  .info-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .info-label { color: var(--muted); min-width: 80px; }
  .info-value { font-weight: 600; }
  
  .task-description { background: var(--bg); border-radius: 12px; padding: 16px; margin-bottom: 20px; line-height: 1.8; font-size: 14px; }
  
  .questions-section { margin-top: 20px; }
  .question-card { background: var(--bg); border: 2px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .question-number { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
  .question-content { font-size: 14px; line-height: 1.8; margin-bottom: 12px; }
  .question-content * { max-width: 100% !important; box-sizing: border-box !important; }
  .question-content script, .question-content style { display: none !important; }
  
  .answer-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .answer-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; display: block; }
  .answer-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); font-family: inherit; font-size: 14px; box-sizing: border-box; min-height: 80px; resize: vertical; }
  .answer-input:focus { outline: none; border-color: var(--primary); }
  
  .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #8B7CF6); color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; }
  .result { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; }
  .result.success { background: var(--success-soft); color: #15803D; }
  .result.error { background: var(--danger-soft); color: var(--danger); }
  
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
  
  .deadline-warning { background: #FEF3C7; border: 2px solid #F59E0B; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #92400E; display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <div class="back-btn" onclick="window.location.href='student-home.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="page-title">
        <h1 id="taskTitle">جزئیات تکلیف</h1>
        <p id="taskMeta">در حال بارگذاری...</p>
      </div>
    </div>

    <div id="loading" class="loading">
      <p>در حال بارگذاری تکلیف...</p>
    </div>

    <div id="taskContent" style="display:none">
      <div id="deadlineWarning"></div>
      
      <div class="card task-info">
        <div class="info-row">
          <span class="info-label">📚 درس:</span>
          <span class="info-value" id="infoSubject">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">🎓 پایه:</span>
          <span class="info-value" id="infoGrade">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">👨‍🏫 معلم:</span>
          <span class="info-value" id="infoTeacher">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">⏰ مهلت:</span>
          <span class="info-value" id="infoDeadline">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">📝 نوع پاسخ:</span>
          <span class="info-value" id="infoAnswerType">-</span>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px;font-size:15px">📋 توضیحات تکلیف</h3>
        <div class="task-description" id="taskDescription"></div>
      </div>

      <div class="card questions-section">
        <h3 style="margin:0 0 16px;font-size:15px">✏️ سوالات تکلیف</h3>
        <div id="questionsList"></div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitTask()">ارسال پاسخ</button>
      <div id="result"></div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
const token = localStorage.getItem('token');
const urlParams = new URLSearchParams(window.location.search);
const taskId = urlParams.get('id');
let taskData = null;

if (!taskId) {
  alert('شناسه تکلیف مشخص نیست!');
  window.location.href = 'student-home.html';
}

const answerTypeLabels = {
  'text': 'متنی',
  'voice': 'صوتی',
  'image': 'تصویری',
  'file': 'فایل'
};

async function loadTask() {
  try {
    const res = await fetch(`/api/teacher/get-task?taskId=${taskId}`, { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await res.json();
    
    if (data.success && data.task) {
      taskData = data.task;
      
      document.getElementById('taskTitle').textContent = taskData.title;
      document.getElementById('taskMeta').textContent = `${taskData.subject || '-'} | پایه ${taskData.grade || '-'}`;
      document.getElementById('infoSubject').textContent = taskData.subject || '-';
      document.getElementById('infoGrade').textContent = taskData.grade || '-';
      document.getElementById('infoTeacher').textContent = taskData.teacher_name || '-';
      document.getElementById('infoAnswerType').textContent = answerTypeLabels[taskData.answer_type] || 'متنی';
      
      // مهلت
      if (taskData.deadline) {
        const deadline = new Date(taskData.deadline);
        document.getElementById('infoDeadline').textContent = deadline.toLocaleString('fa-IR');
        
        // هشدار مهلت
        const now = new Date();
        const diff = deadline - now;
        if (diff > 0 && diff < 24 * 60 * 60 * 1000) {
          const hours = Math.floor(diff / (60 * 60 * 1000));
          document.getElementById('deadlineWarning').innerHTML = `
            <div class="deadline-warning">
              ⚠️ مهلت ارسال تا ${hours} ساعت دیگر به پایان می‌رسد!
            </div>
          `;
        } else if (diff <= 0) {
          document.getElementById('deadlineWarning').innerHTML = `
            <div class="deadline-warning" style="background:#FEE2E2;border-color:#DC2626;color:#991B1B">
              ❌ مهلت ارسال به پایان رسیده است!
            </div>
          `;
          document.getElementById('submitBtn').disabled = true;
        }
      } else {
        document.getElementById('infoDeadline').textContent = 'بدون مهلت';
      }
      
      // توضیحات (بدون بخش سوالات)
      let description = taskData.description || '';
      if (description.includes('task-questions-container')) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = description;
        const qContainer = tempDiv.querySelector('.task-questions-container');
        if (qContainer) {
          qContainer.remove();
        }
        description = tempDiv.innerHTML;
      }
      document.getElementById('taskDescription').innerHTML = description || '<p style="color:var(--muted)">توضیحاتی ثبت نشده است</p>';
      
      // سوالات
      const questionsList = document.getElementById('questionsList');
      if (taskData.description && taskData.description.includes('task-questions-container')) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = taskData.description;
        const qContainer = tempDiv.querySelector('.task-questions-container');
        if (qContainer) {
          const questionItems = qContainer.querySelectorAll('.task-question');
          if (questionItems.length > 0) {
            questionsList.innerHTML = Array.from(questionItems).map((item, index) => `
              <div class="question-card">
                <div class="question-number">سوال ${index + 1}</div>
                <div class="question-content">${item.innerHTML.replace(/<strong>سوال \d+:<\/strong>\s*/, '')}</div>
                <div class="answer-section">
                  <label class="answer-label">پاسخ شما:</label>
                  <textarea class="answer-input" id="answer-${index}" placeholder="پاسخ خود را اینجا بنویسید..."></textarea>
                </div>
              </div>
            `).join('');
          } else {
            questionsList.innerHTML = '<div class="empty-state"><p>سوالی در این تکلیف وجود ندارد</p></div>';
          }
        } else {
          questionsList.innerHTML = '<div class="empty-state"><p>سوالی در این تکلیف وجود ندارد</p></div>';
        }
      } else {
        questionsList.innerHTML = '<div class="empty-state"><p>سوالی در این تکلیف وجود ندارد</p></div>';
      }
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('taskContent').style.display = 'block';
    } else {
      alert('تکلیف یافت نشد!');
      window.location.href = 'student-home.html';
    }
  } catch (err) {
    document.getElementById('loading').innerHTML = '<p style="color:var(--danger)">خطا در بارگذاری تکلیف</p>';
    console.error('Error loading task:', err);
  }
}

async function submitTask() {
  const btn = document.getElementById('submitBtn');
  const resDiv = document.getElementById('result');
  
  // جمع‌آوری پاسخ‌ها
  const answers = [];
  const questionCards = document.querySelectorAll('.question-card');
  questionCards.forEach((card, index) => {
    const answerInput = document.getElementById(`answer-${index}`);
    if (answerInput) {
      answers.push({
        questionIndex: index,
        answer: answerInput.value.trim()
      });
    }
  });
  
  if (answers.length === 0 || answers.every(a => !a.answer)) {
    resDiv.className = 'result error';
    resDiv.textContent = '❌ لطفاً حداقل به یک سوال پاسخ دهید';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'در حال ارسال...';
  resDiv.innerHTML = '';
  
  try {
    const res = await fetch('/api/student/submit-task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        taskId: parseInt(taskId),
        answers: answers
      })
    });
    
    const data = await res.json();
    
    if (data.success) {
      resDiv.className = 'result success';
      resDiv.textContent = '✅ پاسخ شما با موفقیت ارسال شد!';
      btn.textContent = 'ارسال شد ✓';
      setTimeout(() => {
        window.location.href = 'student-home.html';
      }, 2000);
    } else {
      resDiv.className = 'result error';
      resDiv.textContent = '❌ ' + (data.message || 'خطا در ارسال پاسخ');
      btn.disabled = false;
      btn.textContent = 'ارسال پاسخ';
    }
  } catch (err) {
    resDiv.className = 'result error';
    resDiv.textContent = '❌ خطا: ' + err.message;
    btn.disabled = false;
    btn.textContent = 'ارسال پاسخ';
  }
}

loadTask();
</script>
</body>
</html>
