<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمرات و بازخوردها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 24px; min-height: 100%; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: white; border: 2px solid #E5E7EB; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
  .back-btn svg { width: 20px; height: 20px; color: #6B7280; }
  .page-title h1 { font-size: 18px; font-weight: 800; color: #1F2937; margin: 0; }
  
  .stats-card { background: linear-gradient(135deg, #F59E0B, #F97316); border-radius: 20px; padding: 24px; margin-bottom: 24px; color: white; text-align: center; }
  .stats-value { font-size: 36px; font-weight: 800; margin: 8px 0; }
  .stats-label { font-size: 14px; opacity: 0.9; }

  .grade-card { background: white; border: 2px solid #E5E7EB; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .grade-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .grade-title { font-size: 15px; font-weight: 700; color: #1F2937; margin: 0 0 4px; }
  .grade-subject { font-size: 12px; color: #6B7280; }
  
  .stars { display: flex; gap: 2px; font-size: 18px; }
  .star { color: #E5E7EB; }
  .star.active { color: #F59E0B; }

  .feedback-box { background: #F9FAFB; border-radius: 12px; padding: 12px; margin-top: 12px; border-right: 4px solid #6C5CE7; }
  .feedback-label { font-size: 12px; font-weight: 700; color: #6C5CE7; margin-bottom: 4px; }
  .feedback-text { font-size: 13px; color: #374151; line-height: 1.6; white-space: pre-wrap; }

  .status-badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .status-reviewed { background: #DCFCE7; color: #15803D; }
  .status-revision { background: #FEE2E2; color: #DC2626; }
  .status-pending { background: #FEF3C7; color: #D97706; }

  .empty-state { text-align: center; padding: 40px 16px; color: #6B7280; }
  .loading { text-align: center; padding: 40px; color: #6B7280; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <a href="student-home.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="page-title">
        <h1>کارنامه و بازخوردها</h1>
      </div>
    </div>

    <div class="stats-card">
      <div class="stats-label">میانگین نمرات شما</div>
      <div class="stats-value" id="averageScore">-</div>
      <div class="stats-label">از ۲۰ <span id="gradedCount" style="margin-right: 8px; opacity: 0.8;">(۰ تکلیف بررسی‌شده)</span></div>
    </div>

    <div id="gradesList">
      <div class="loading">در حال بارگذاری نمرات...</div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
const token = localStorage.getItem('token');

if (!user || user.role !== 'student') {
  window.location.href = 'login.html?role=student';
}

async function loadGrades() {
  const list = document.getElementById('gradesList');
  
  try {
    const res = await fetch('/api/student/get-grades', { 
      headers: { 'Authorization': 'Bearer ' + token } 
    });
    const data = await res.json();
    
    if (data.success) {
      // به‌روزرسانی آمار
      document.getElementById('averageScore').textContent = data.stats.average;
      document.getElementById('gradedCount').textContent = `(${data.stats.totalGraded} تکلیف بررسی‌شده)`;

      if (data.grades.length > 0) {
        list.innerHTML = data.grades.map(grade => {
          // محاسبه ستاره‌ها (از ۵ ستاره)
          const maxScore = grade.max_score || 20;
          const starCount = grade.score !== null ? Math.round((grade.score / maxScore) * 5) : 0;
          
          let starsHtml = '';
          for (let i = 1; i <= 5; i++) {
            starsHtml += `<span class="star ${i <= starCount ? 'active' : ''}">★</span>`;
          }

          let statusClass = 'status-pending';
          let statusText = 'در انتظار بررسی';
          if (grade.status === 'reviewed') { statusClass = 'status-reviewed'; statusText = 'بررسی‌شده'; }
          if (grade.status === 'revision') { statusClass = 'status-revision'; statusText = 'نیاز به اصلاح'; }

          const scoreText = grade.score !== null ? `نمره: ${grade.score} از ${maxScore}` : 'بدون نمره';
          const date = new Date(grade.reviewed_at || grade.submitted_at).toLocaleDateString('fa-IR');

          return `
            <div class="grade-card">
              <div class="grade-header">
                <div>
                  <h3 class="grade-title">${grade.task_title}</h3>
                  <div class="grade-subject">${grade.subject || 'عمومی'} • ${grade.teacher_name || 'معلم'} • ${date}</div>
                </div>
                <span class="status-badge ${statusClass}">${statusText}</span>
              </div>
              
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div class="stars">${starsHtml}</div>
                <div style="font-size: 14px; font-weight: 700; color: #1F2937;">${scoreText}</div>
              </div>

              ${grade.feedback ? `
                <div class="feedback-box">
                  <div class="feedback-label">💬 بازخورد معلم:</div>
                  <div class="feedback-text">${grade.feedback}</div>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } else {
        list.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 48px; margin-bottom: 8px;">📭</div>
            <p>هنوز تکلیفی بررسی نشده است.</p>
          </div>
        `;
      }
    } else {
      list.innerHTML = '<div class="empty-state"><p>خطا در دریافت اطلاعات</p></div>';
    }
  } catch (err) {
    console.error(err);
    list.innerHTML = '<div class="empty-state"><p>خطا در ارتباط با سرور</p></div>';
  }
}

loadGrades();
</script>
</body>
</html>
