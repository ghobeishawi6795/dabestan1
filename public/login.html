<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .login-screen{
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    margin-bottom:24px;
    transition:color .2s;
  }
  .back-link:hover{color:var(--primary);}
  .back-link svg{
    width:18px;
    height:18px;
    transform:scaleX(-1);
  }
  .login-header{
    text-align:center;
    margin-bottom:32px;
  }
  .login-icon{
    width:72px;
    height:72px;
    margin:0 auto 16px;
    border-radius:24px;
    background:linear-gradient(135deg,var(--primary),#8B7CF6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    box-shadow:0 12px 28px rgba(108,92,231,.3);
  }
  .login-header h1{
    margin:0 0 6px;
    font-size:22px;
    font-weight:800;
    color:var(--text);
  }
  .login-header p{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
  .login-card{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:28px 24px;
    box-shadow:var(--shadow);
  }
  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--text-2);
    margin-bottom:8px;
  }
  .input{
    width:100%;
    padding:14px 16px;
    border:1.5px solid var(--border);
    border-radius:14px;
    background:var(--bg);
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    transition:all .2s var(--ease);
    box-sizing:border-box;
  }
  .input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
    background:var(--card);
  }
  .input::placeholder{
    color:var(--muted);
  }
  .submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),#8B7CF6);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(108,92,231,.3);
    transition:all .2s var(--ease);
    margin-top:8px;
  }
  .submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(108,92,231,.4);
  }
  .submit-btn:active{
    transform:scale(.98);
  }
  .submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
  }
  .result{
    margin-top:16px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    text-align:center;
    display:none;
  }
  .result.show{display:block;}
  .result.error{
    background:var(--danger-soft);
    color:var(--danger);
  }
  .result.success{
    background:var(--success-soft);
    color:#15803D;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="login-screen">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      بازگشت به صفحه اصلی
    </a>

    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1 id="loginTitle">ورود به سامانه</h1>
      <p id="loginSubtitle">کد ورود و رمز عبور را وارد کنید</p>
    </div>

    <div class="login-card">
      <form id="loginForm">
        <div class="field">
          <label for="inviteCode">کد ورود</label>
          <input 
            type="text" 
            id="inviteCode" 
            class="input" 
            placeholder="مثلاً: SCH-A1B2C3" 
            required 
            autocomplete="off"
          />
        </div>
        
        <div class="field">
          <label for="password">رمز عبور</label>
          <input 
            type="password" 
            id="password" 
            class="input" 
            placeholder="رمز عبور خود را وارد کنید" 
            required 
          />
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">
          ورود به سامانه
        </button>
      </form>
      
      <div id="result" class="result"></div>
    </div>
  </div>

</div>

<script>
// دریافت نقش از URL
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role');

const roleNames = {
  'admin': 'مدیر مدرسه',
  'teacher': 'معلم',
  'student': 'دانش‌آموز'
};

if (role && roleNames[role]) {
  document.getElementById('loginTitle').textContent = 'ورود ' + roleNames[role];
  document.getElementById('loginSubtitle').textContent = 'کد ورود و رمز عبور خود را وارد کنید';
}

// مدیریت فرم ورود
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const inviteCode = document.getElementById('inviteCode').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  
  // اعتبارسنجی
  if (!inviteCode || !password) {
    result.textContent = ' لطفاً کد ورود و رمز عبور را وارد کنید';
    result.className = 'result show error';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'در حال ورود...';
  result.className = 'result';
  result.textContent = '';
  
  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        inviteCode: inviteCode,
        password: password
      })
    });
    
    const data = await response.json();
    
    if (data.success && data.user) {
      // ذخیره اطلاعات کاربر
      localStorage.setItem('user', JSON.stringify(data.user));
      
      result.textContent = '✅ ورود موفق! در حال انتقال...';
      result.className = 'result show success';
      
      // هدایت بر اساس نقش
      setTimeout(() => {
        if (data.user.role === 'admin') {
          window.location.href = 'admin-home.html';
        } else if (data.user.role === 'teacher') {
          window.location.href = 'teacher-home.html';
        } else if (data.user.role === 'student') {
          window.location.href = 'student-home.html';
        }
      }, 1000);
    } else {
      result.textContent = '❌ ' + (data.message || 'کد ورود یا رمز عبور اشتباه است');
      result.className = 'result show error';
    }
  } catch (error) {
    console.error('Login error:', error);
    result.textContent = ' خطا در اتصال به سرور. لطفاً دوباره تلاش کنید.';
    result.className = 'result show error';
  }
  
  btn.disabled = false;
  btn.textContent = 'ورود به سامانه';
});
</script>

</body>
</html>
