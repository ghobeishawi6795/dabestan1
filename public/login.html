<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به دبستان</title>
    <link rel="stylesheet" href="/shared.css">
</head>
<body>
    <div class="container" style="max-width:400px; margin:100px auto;">
        <h1>🔐 ورود به سامانه</h1>
        <form id="login-form">
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">ورود</button>
        </form>
        <div id="error-message" style="color:red; margin-top:10px;"></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                // ذخیره توکن و اطلاعات کاربر
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                alert('✅ ورود موفق!');
                // هدایت بر اساس نقش
                if (data.user.role === 'admin') window.location.href = '/admin-dashboard.html';
                else if (data.user.role === 'teacher') window.location.href = '/teacher-dashboard.html';
                else window.location.href = '/student-dashboard.html';
            } else {
                document.getElementById('error-message').textContent = '❌ ' + data.error;
            }
        });
    </script>
</body>
</html>
