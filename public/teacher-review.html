<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>دبستان — بررسی تکلیف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .phone{padding-bottom:100px;}
  
  .header{
    padding:18px 20px 14px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--bg);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .2s var(--ease);
    text-decoration:none;
    color:var(--text);
  }
  .back-btn:hover{background:var(--primary-soft);}
  .back-btn svg{
    width:20px;
    height:20px;
    transform:scaleX(-1);
  }
  .header-info{flex:1;}
  .header-title{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .header-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
  }
  .header-count{
    background:var(--warning-soft);
    color:#B45309;
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }

  .status-bar{
    margin:16px 20px;
    background:var(--card);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow-sm);
    display:flex;
    gap:6px;
    animation:fadeUp .4s var(--ease) both;
  }
  .status-segment{
    height:8px;
    border-radius:999px;
    transition:width .6s var(--ease);
  }
  .status-segment.done{background:var(--success);}
  .status-segment.review{background:var(--warning);}
  .status-segment.pending{background:var(--border);}
  .status-legend{
    display:flex;
    gap:14px;
    margin-top:10px;
    font-size:11px;
    color:var(--text-2);
  }
  .status-legend span{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .legend-dot{
    width:8px;
    height:8px;
    border-radius:50%;
  }
  .legend-dot.done{background:var(--success);}
  .legend-dot.review{background:var(--warning);}
  .legend-dot.pending{background:var(--border);}

  .tabs{
    display:flex;
    gap:8px;
    padding:0 20px;
    margin-bottom:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    padding:7px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    background:var(--card);
    color:var(--text-2);
    border:1.5px solid var(--border);
    cursor:pointer;
    transition:all .2s var(--ease);
    white-space:nowrap;
  }
  .tab.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
  }
  .tab .count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    border-radius:999px;
    font-size:10px;
    font-weight:800;
    margin-right:4px;
    background:rgba(0,0,0,.08);
  }
  .tab.active .count{
    background:rgba(255,255,255,.25);
    color:#fff;
  }

  .responses{
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .response{
    background:var(--card);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    transition:all .2s var(--ease);
    animation:fadeUp .4s var(--ease) both;
  }
  .response:nth-child(1){animation-delay:.05s;}
  .response:nth-child(2){animation-delay:.1s;}
  .response:nth-child(3){animation-delay:.15s;}
  .response:nth-child(4){animation-delay:.2s;}
  .response:hover{
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  .response:active{transform:scale(.98);}

  .response-head{
    padding:14px 14px 10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .response-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:#fff;
    font-size:16px;
    flex-shrink:0;
  }
  .av-1{background:linear-gradient(135deg,#FFB86B,#FF7A90);}
  .av-2{background:linear-gradient(135deg,#6BCB77,#4D96FF);}
  .av-3{background:linear-gradient(135deg,#9B59B6,#E74C3C);}
  .av-4{background:linear-gradient(135deg,#3498DB,#2ECC71);}

  .response-info{flex:1; min-width:0;}
  .response-name{
    font-size:14px;
    font-weight:700;
    margin:0;
  }
  .response-time{
    font-size:11px;
    color:var(--muted);
  }
  .response-badge{
    font-size:10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
  }
  .badge-new{background:var(--warning-soft); color:#B45309;}
  .badge-scored{background:var(--success-soft); color:#15803D;}

  .response-preview{
    margin:0 14px 14px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
  }
  .response-img{
    width:100%;
    height:160px;
    background:linear-gradient(135deg,#f0e6ff,#e0f0ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    position:relative;
  }
  .response-img::after{
    content:"🔍 بزرگ‌نمایی";
    position:absolute;
    bottom:8px;
    left:8px;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:10px;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .response-text-preview{
    background:var(--bg);
    padding:12px 14px;
    border-radius:14px;
    font-size:13px;
    color:var(--text-2);
    line-height:1.8;
  }
  .response-audio-preview{
    background:var(--bg);
    padding:12px 14px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .play-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(108,92,231,.3);
  }
  .audio-wave{
    flex:1;
    height:32px;
    display:flex;
    align-items:center;
    gap:2px;
  }
  .audio-wave span{
    flex:1;
    background:var(--primary-soft);
    border-radius:999px;
    min-width:3px;
  }
  .audio-duration{
    font-size:11px;
    color:var(--muted);
    font-weight:600;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,20,40,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s var(--ease);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .sheet{
    width:100%;
    max-width:430px;
    background:var(--card);
    border-radius:28px 28px 0 0;
    padding:0;
    transform:translateY(100%);
    transition:transform .4s var(--ease);
    max-height:90vh;
    overflow-y:auto;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{
    width:40px;
    height:4px;
    border-radius:999px;
    background:var(--border);
    margin:12px auto 0;
  }
  .sheet-header{
    padding:16px 22px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
  }
  .sheet-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#FFB86B,#FF7A90);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:#fff;
    font-size:20px;
  }
  .sheet-name{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .sheet-task{
    font-size:12px;
    color:var(--muted);
  }

  .sheet-body{padding:18px 22px;}

  .sheet-image{
    width:100%;
    height:220px;
    background:linear-gradient(135deg,#f0e6ff,#e0f0ff);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:72px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .sheet-image .zoom-hint{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.5);
    color:#fff;
    font-size:11px;
    font-weight:600;
    padding:4px 12px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }

  .score-section{margin-bottom:18px;}
  .score-label{
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stars{
    display:flex;
    gap:6px;
    direction:ltr;
  }
  .star{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--bg);
    border:2px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    transition:all .2s var(--ease);
  }
  .star:hover{transform:scale(1.15);}
  .star.active{
    background:var(--warning-soft);
    border-color:var(--warning);
    transform:scale(1.1);
  }
  .score-text{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
  }

  .feedback-section{margin-bottom:18px;}
  .feedback-label{
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
  }
  .feedback-input{
    width:100%;
    min-height:80px;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:14px;
    background:var(--bg);
    font-family:inherit;
    font-size:13px;
    color:var(--text);
    resize:vertical;
    transition:all .2s var(--ease);
  }
  .feedback-input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
    background:var(--card);
  }
  .feedback-input::placeholder{color:var(--muted);}

  .quick-feedbacks{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
  }
  .quick-fb{
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
    background:var(--primary-soft);
    color:var(--primary);
    border:none;
    cursor:pointer;
    transition:all .2s var(--ease);
  }
  .quick-fb:hover{
    background:var(--primary);
    color:#fff;
  }

  .sheet-actions{
    padding:16px 22px 24px;
    display:flex;
    gap:10px;
    border-top:1px solid var(--border);
  }
  .btn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:all .2s var(--ease);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn:active{transform:scale(.97);}
  .btn-warning{
    background:var(--warning-soft);
    color:#B45309;
  }
  .score-input-row{
    display:flex;
    align-items:center;
    gap:10px;
    direction:ltr;
  }
  .score-input{
    width:90px;
    padding:10px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:var(--bg);
    font-family:inherit;
    font-size:18px;
    font-weight:800;
    text-align:center;
  }
  .score-input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
  }
  .score-max{
    font-size:13px;
    color:var(--muted);
    font-weight:700;
  }
  .not-submitted{opacity:.6;}
  .response-file-preview{
    margin:0 14px 14px;
  }
  .response-file-preview img{
    width:100%;
    border-radius:14px;
    display:block;
  }
</style>
</head>
<body>

<div class="phone">

  <header class="header">
    <div class="header-row">
      <a href="teacher-manage-tasks.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="header-info">
        <h1 class="header-title" id="taskTitle">در حال بارگذاری...</h1>
        <div class="header-sub" id="taskSub"></div>
      </div>
      <div class="header-count" id="newCount"></div>
    </div>
  </header>

  <div class="status-bar">
    <div style="flex:1;">
      <div style="display:flex; gap:4px;" id="statusSegments"></div>
      <div class="status-legend">
        <span><div class="legend-dot done"></div> <span id="doneCount">0</span> بررسی‌شده</span>
        <span><div class="legend-dot review"></div> <span id="reviewCount">0</span> منتظر</span>
        <span><div class="legend-dot pending"></div> <span id="pendingCount">0</span> تحویل‌نداده</span>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-filter="all">همه <span class="count" id="tabAllCount">0</span></div>
    <div class="tab" data-filter="pending">منتظر بررسی <span class="count" id="tabPendingCount">0</span></div>
    <div class="tab" data-filter="reviewed">بررسی‌شده <span class="count" id="tabReviewedCount">0</span></div>
    <div class="tab" data-filter="none">تحویل‌نداده <span class="count" id="tabNoneCount">0</span></div>
  </div>

  <div class="responses" id="responsesList">
    <div class="empty-state" style="text-align:center;padding:32px;color:var(--muted);">در حال بارگذاری...</div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-avatar" id="sheetAvatar">؟</div>
      <div>
        <h3 class="sheet-name" id="sheetName"></h3>
        <div class="sheet-task" id="sheetTask"></div>
      </div>
    </div>
    <div class="sheet-body">

      <div id="sheetAnswerArea"></div>

      <div class="score-section">
        <div class="score-label">⭐ نمره</div>
        <div class="score-input-row">
          <input type="number" class="score-input" id="scoreInput" min="0" />
          <span class="score-max" id="scoreMaxLabel">از ۲۰</span>
        </div>
      </div>

      <div class="feedback-section">
        <div class="feedback-label">💬 بازخورد</div>
        <textarea class="feedback-input" id="feedbackInput" placeholder="بازخورد خود را برای دانش‌آموز بنویسید..."></textarea>
        <div class="quick-feedbacks">
          <button class="quick-fb" data-fb="آفرین! عالی بود 🌟">آفرین! عالی بود 🌟</button>
          <button class="quick-fb" data-fb="خیلی مرتب حل کردی 👏">خیلی مرتب 👏</button>
          <button class="quick-fb" data-fb="دوباره بررسی کن 🔄">دوباره بررسی کن 🔄</button>
        </div>
      </div>

    </div>
    <div class="sheet-actions">
      <button class="btn btn-warning" id="btnRevision">↩️ درخواست اصلاح</button>
      <button class="btn btn-primary" id="btnApprove">✅ تأیید و ارسال</button>
    </div>
  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!user.id || user.role !== 'teacher') {
    window.location.href = 'login.html?role=teacher';
  }

  const urlParams = new URLSearchParams(window.location.search);
  const taskId = urlParams.get('taskId');
  if (!taskId) {
    window.location.href = 'teacher-manage-tasks.html';
  }

  let currentTask = null;
  let allSubmissions = [];
  let activeFilter = 'all';
  let activeSubmissionId = null;

  function submissionState(s) {
    if (!s.submission_id) return 'none';
    if (s.status === 'reviewed') return 'reviewed';
    return 'pending'; // pending or revision both count as "awaiting review" for the tab
  }

  async function loadSubmissions() {
    try {
      const res = await fetch(`/api/teacher/get-submissions?teacherId=${user.id}&taskId=${taskId}`);
      const data = await res.json();

      if (!data.success) {
        alert(data.message || 'خطا در بارگذاری');
        window.location.href = 'teacher-manage-tasks.html';
        return;
      }

      currentTask = data.task;
      allSubmissions = data.submissions;

      document.getElementById('taskTitle').textContent = currentTask.title;
      document.getElementById('taskSub').textContent = `${currentTask.subject || ''} • مهلت: ${currentTask.deadline ? new Date(currentTask.deadline).toLocaleString('fa-IR') : 'ندارد'}`;

      render();
    } catch (err) {
      document.getElementById('responsesList').innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);">خطا در بارگذاری پاسخ‌ها</div>';
    }
  }

  function render() {
    const total = allSubmissions.length;
    const doneCount = allSubmissions.filter(s => submissionState(s) === 'reviewed').length;
    const pendingReviewCount = allSubmissions.filter(s => submissionState(s) === 'pending').length;
    const noneCount = allSubmissions.filter(s => submissionState(s) === 'none').length;

    document.getElementById('doneCount').textContent = doneCount;
    document.getElementById('reviewCount').textContent = pendingReviewCount;
    document.getElementById('pendingCount').textContent = noneCount;
    document.getElementById('tabAllCount').textContent = total;
    document.getElementById('tabPendingCount').textContent = pendingReviewCount;
    document.getElementById('tabReviewedCount').textContent = doneCount;
    document.getElementById('tabNoneCount').textContent = noneCount;
    document.getElementById('newCount').textContent = pendingReviewCount + ' جدید';

    const seg = document.getElementById('statusSegments');
    seg.innerHTML = '';
    if (total > 0) {
      seg.innerHTML = `
        <div class="status-segment done" style="width:${doneCount/total*100}%;"></div>
        <div class="status-segment review" style="width:${pendingReviewCount/total*100}%;"></div>
        <div class="status-segment pending" style="width:${noneCount/total*100}%;"></div>
      `;
    }

    let filtered = allSubmissions;
    if (activeFilter !== 'all') {
      filtered = allSubmissions.filter(s => submissionState(s) === activeFilter);
    }

    const list = document.getElementById('responsesList');
    if (filtered.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);">موردی نیست</div>';
      return;
    }

    list.innerHTML = filtered.map(s => {
      const state = submissionState(s);
      const initial = (s.student_name || '?').charAt(0);
      let badge = '';
      if (state === 'reviewed') badge = `<span class="response-badge badge-scored">⭐ ${s.score ?? '-'}</span>`;
      else if (state === 'pending') badge = `<span class="response-badge badge-new">${s.status === 'revision' ? '↩️ اصلاح‌شده، منتظر' : '⏳ جدید'}</span>`;

      let preview = '';
      if (s.answer_text) {
        preview = `<div class="response-preview"><div class="response-text-preview">${escapeHtml(s.answer_text)}</div></div>`;
      } else if (s.answer_file && s.answer_file_type === 'image') {
        preview = `<div class="response-file-preview"><img src="${s.answer_file}" /></div>`;
      } else if (s.answer_file) {
        preview = `<div class="response-preview"><div class="response-text-preview">📎 فایل ضمیمه ارسال شده</div></div>`;
      }

      return `
        <div class="response ${state === 'none' ? 'not-submitted' : ''}" onclick="${state === 'none' ? '' : `openSheet(${s.submission_id})`}">
          <div class="response-head">
            <div class="response-avatar av-${(s.student_id % 4) + 1}">${initial}</div>
            <div class="response-info">
              <h3 class="response-name">${s.student_name}</h3>
              <div class="response-time">${state === 'none' ? 'هنوز ارسال نکرده' : (s.submitted_at ? new Date(s.submitted_at).toLocaleString('fa-IR') : '')}</div>
            </div>
            ${badge}
          </div>
          ${preview}
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      activeFilter = tab.dataset.filter;
      render();
    });
  });

  const overlay = document.getElementById('overlay');

  function openSheet(submissionId) {
    const s = allSubmissions.find(x => x.submission_id === submissionId);
    if (!s) return;
    activeSubmissionId = submissionId;

    document.getElementById('sheetName').textContent = s.student_name;
    document.getElementById('sheetAvatar').textContent = (s.student_name || '?').charAt(0);
    document.getElementById('sheetTask').textContent = `${currentTask.title} • ${currentTask.subject || ''}`;

    let answerHtml = '';
    if (s.answer_text) {
      answerHtml += `<div class="response-text-preview" style="margin-bottom:14px;">${escapeHtml(s.answer_text)}</div>`;
    }
    if (s.answer_file && s.answer_file_type === 'image') {
      answerHtml += `<img src="${s.answer_file}" style="width:100%;border-radius:14px;margin-bottom:14px;" />`;
    } else if (s.answer_file) {
      answerHtml += `<a href="${s.answer_file}" download="ضمیمه" class="response-text-preview" style="display:block;margin-bottom:14px;">📎 دانلود فایل ضمیمه‌شده</a>`;
    }
    document.getElementById('sheetAnswerArea').innerHTML = answerHtml || '<p style="color:var(--muted);">پاسخی ثبت نشده</p>';

    document.getElementById('scoreInput').value = s.score ?? '';
    document.getElementById('scoreInput').max = currentTask.max_score || 20;
    document.getElementById('scoreMaxLabel').textContent = 'از ' + (currentTask.max_score || 20);
    document.getElementById('feedbackInput').value = s.feedback || '';

    overlay.classList.add('open');
  }

  overlay.addEventListener('click',(e)=>{
    if(e.target === overlay) overlay.classList.remove('open');
  });

  document.querySelectorAll('.quick-fb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const input = document.getElementById('feedbackInput');
      input.value = input.value ? input.value + '\n' + btn.dataset.fb : btn.dataset.fb;
      input.focus();
    });
  });

  async function submitReview(status) {
    const score = document.getElementById('scoreInput').value;
    const feedback = document.getElementById('feedbackInput').value.trim();

    if (status === 'revision' && !feedback) {
      alert('لطفاً دلیل درخواست اصلاح را بنویسید.');
      return;
    }

    try {
      const res = await fetch('/api/teacher/review-submission', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          teacherId: user.id,
          submissionId: activeSubmissionId,
          score: score === '' ? null : score,
          feedback,
          status
        })
      });
      const data = await res.json();
      if (data.success) {
        overlay.classList.remove('open');
        await loadSubmissions();
      } else {
        alert('❌ ' + data.message);
      }
    } catch (err) {
      alert('خطا در ثبت بازخورد');
    }
  }

  document.getElementById('btnApprove').addEventListener('click', () => submitReview('reviewed'));
  document.getElementById('btnRevision').addEventListener('click', () => submitReview('revision'));

  loadSubmissions();
</script>

</body>
</html>
