<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بررسی پاسخ‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Vazirmatn', sans-serif; background: #F5F3FF; color: #1F2937; direction: rtl; }
  .phone { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #F5F3FF; }
  .screen { padding: 24px; min-height: 100%; }
  
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: white; border: 2px solid #E5E7EB; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .back-btn svg { width: 20px; height: 20px; color: #6B7280; }
  .page-title { flex: 1; }
  .page-title h1 { font-size: 18px; font-weight: 800; color: #1F2937; margin: 0; }
  .page-title p { font-size: 12px; color: #6B7280; margin: 4px 0 0; }

  .task-card { background: white; border: 2px solid #E5E7EB; border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all .2s; }
  .task-card:hover { border-color: #6C5CE7; transform: translateY(-2px); }
  .task-title { font-size: 15px; font-weight: 700; color: #1F2937; margin-bottom: 8px; }
  .task-meta { display: flex; justify-content: space-between; font-size: 12px; color: #6B7280; }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.pending { background: #FEF3C7; color: #D97706; }
  .badge.done { background: #DCFCE7; color: #15803D; }

  .student-card { background: white; border: 2px solid #E5E7EB; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .student-card:hover { border-color: #6C5CE7; }
  .student-info h4 { font-size: 14px; font-weight: 700; color: #1F2937; margin-bottom: 4px; }
  .student-info p { font-size: 11px; color: #6B7280; }
  .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
  .status-pending { background: #FEF3C7; color: #D97706; }
  .status-reviewed { background: #DCFCE7; color: #15803D; }
  .status-revision { background: #FEE2E2; color: #DC2626; }

  .empty-state { text-align: center; padding: 40px 16px; color: #6B7280; }
  .loading { text-align: center; padding: 40px; color: #6B7280; }

  /* Modal Styles */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; justify-content: center; }
  .modal.active { display: flex; }
  .modal-content { background: white; border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #F3F4F6; }
  .modal-title { font-size: 16px; font-weight: 800; color: #1F2937; }
  .close-btn { width: 32px; height: 32px; border-radius: 50%; background: #F3F4F6; border: none; font-size: 18px; cursor: pointer; color: #6B7280; display: flex; align-items: center; justify-content: center; }

  .answer-box { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; margin-bottom: 20px; font-size: 14px; line-height: 1.8; color: #374151; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1.5px solid #E5E7EB; border-radius: 10px; font-family: inherit; font-size: 14px; background: white; }
  .form-group textarea { resize: vertical; min-height: 80px; }

  .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6C5CE7, #8B7CF6); color: white; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <!-- Header -->
    <div class="header">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="page-title">
        <h1 id="pageTitle">بررسی پاسخ‌ها</h1>
        <p id="pageSubtitle">لیست تکالیف فعال</p>
      </div>
    </div>

    <!-- Task List View -->
    <div id="taskListView">
      <div id="taskList" class="loading">در حال بارگذاری تکالیف...</div>
    </div>

    <!-- Submission List View (Hidden initially) -->
    <div id="submissionListView" style="display: none;">
      <div id="submissionList" class="loading">در حال بارگذاری پاسخ‌ها...</div>
    </div>
  </div>
</div>

<!-- Grading Modal -->
<div id="gradeModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="modalStudentName">پاسخ دانش‌آموز</div>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    
    <div class="form-group">
      <label>پاسخ ارسالی:</label>
      <div class="answer-box" id="modalAnswer">...</div>
    </div>

    <div class="form-group">
      <label>نمره (از <span id="maxScoreDisplay">20</span>):</label>
      <input type="number" id="gradeScore" min="0" step="0.5">
    </div>

    <div class="form-group">
      <label>وضعیت:</label>
      <select id="gradeStatus">
        <option value="reviewed">تأیید و نمره‌دهی</option>
        <option value="revision">درخواست اصلاح</option>
      </select>
    </div>

    <div class="form-group">
      <label>بازخورد معلم:</label>
      <textarea id="gradeFeedback" placeholder="آفرین! خیلی خوب بود... یا نیاز به تمرین بیشتر داری."></textarea>
    </div>

    <button class="btn-primary" id="submitGradeBtn" onclick="submitGrade()">ثبت نمره و بازخورد</button>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!user || user.role !== 'teacher') {
  window.location.href = 'login.html?role=teacher';
}

let currentTask = null;
let currentSubmission = null;

// Navigation
function goBack() {
  if (document.getElementById('submissionListView').style.display === 'block') {
    document.getElementById('submissionListView').style.display = 'none';
    document.getElementById('taskListView').style.display = 'block';
    document.getElementById('pageTitle').textContent = 'بررسی پاسخ‌ها';
    document.getElementById('pageSubtitle').textContent = 'لیست تکالیف فعال';
  } else {
    window.location.href = 'teacher-home.html';
  }
}

// Load Tasks
async function loadTasks() {
  const container = document.getElementById('taskList');
  try {
    const res = await fetch(`/api/teacher/get-tasks?teacherId=${user.id}`);
    const data = await res.json();
    
    if (data.success && data.tasks && data.tasks.length > 0) {
      container.innerHTML = data.tasks.map(task => `
        <div class="task-card" onclick="loadSubmissions(${task.id}, '${task.title.replace(/'/g, "\\'")}', ${task.max_score || 20})">
          <div class="task-title">${task.title}</div>
          <div class="task-meta">
            <span>📚 ${task.subject || 'عمومی'} | پایه ${task.grade || '-'}</span>
            <span class="badge pending">مشاهده پاسخ‌ها ←</span>
          </div>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<div class="empty-state"><p>هنوز تکلیفی ایجاد نکرده‌اید.</p></div>';
    }
  } catch (err) {
    container.innerHTML = '<div class="empty-state"><p>خطا در بارگذاری تکالیف</p></div>';
    console.error(err);
  }
}

// Load Submissions for a specific task
async function loadSubmissions(taskId, taskTitle, maxScore) {
  document.getElementById('taskListView').style.display = 'none';
  document.getElementById('submissionListView').style.display = 'block';
  document.getElementById('pageTitle').textContent = taskTitle;
  document.getElementById('pageSubtitle').textContent = 'لیست پاسخ‌های ارسالی';
  
  const container = document.getElementById('submissionList');
  container.innerHTML = '<div class="loading">در حال بارگذاری...</div>';
  
  try {
    const res = await fetch(`/api/teacher/get-submissions?taskId=${taskId}&teacherId=${user.id}`);
    const data = await res.json();
    
    if (data.success && data.submissions && data.submissions.length > 0) {
      currentTask = { id: taskId, maxScore: maxScore };
      
      container.innerHTML = data.submissions.map(sub => {
        let statusClass = 'status-pending';
        let statusText = 'در انتظار بررسی';
        if (sub.status === 'reviewed') { statusClass = 'status-reviewed'; statusText = 'بررسی‌شده'; }
        if (sub.status === 'revision') { statusClass = 'status-revision'; statusText = 'نیاز به اصلاح'; }
        
        let scoreDisplay = sub.score !== null ? `نمره: ${sub.score}` : 'بدون نمره';
        
        return `
          <div class="student-card" onclick='openGradeModal(${JSON.stringify(sub).replace(/'/g, "&#39;")})'>
            <div class="student-info">
              <h4>${sub.student_name || 'دانش‌آموز'}</h4>
              <p>${scoreDisplay} • ${new Date(sub.submitted_at).toLocaleDateString('fa-IR')}</p>
            </div>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
        `;
      }).join('');
    } else {
      container.innerHTML = '<div class="empty-state"><p>هنوز پاسخی برای این تکلیف ثبت نشده است.</p></div>';
    }
  } catch (err) {
    container.innerHTML = '<div class="empty-state"><p>خطا در بارگذاری پاسخ‌ها</p></div>';
    console.error(err);
  }
}

// Open Grading Modal
function openGradeModal(submission) {
  currentSubmission = submission;
  document.getElementById('modalStudentName').textContent = submission.student_name || 'دانش‌آموز';
  
  // Parse answer if it's JSON, otherwise show as text
  let answerText = submission.answer_text || 'پاسخی ثبت نشده است.';
  try {
    const parsed = JSON.parse(answerText);
    answerText = JSON.stringify(parsed, null, 2); // Format JSON nicely
  } catch (e) {
    // It's plain text or HTML, leave as is
  }
  document.getElementById('modalAnswer').textContent = answerText;
  
  document.getElementById('maxScoreDisplay').textContent = currentTask.maxScore;
  document.getElementById('gradeScore').value = submission.score || '';
  document.getElementById('gradeFeedback').value = submission.feedback || '';
  document.getElementById('gradeStatus').value = submission.status || 'reviewed';
  
  document.getElementById('gradeModal').classList.add('active');
}

function closeModal() {
  document.getElementById('gradeModal').classList.remove('active');
}

// Submit Grade
async function submitGrade() {
  const btn = document.getElementById('submitGradeBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ثبت...';
  
  const score = document.getElementById('gradeScore').value;
  const feedback = document.getElementById('gradeFeedback').value;
  const status = document.getElementById('gradeStatus').value;
  
  try {
    const res = await fetch('/api/teacher/update-submission', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        submissionId: currentSubmission.id,
        teacherId: user.id,
        score: score === '' ? null : parseFloat(score),
        feedback: feedback,
        status: status
      })
    });
    
    const data = await res.json();
    if (data.success) {
      alert('✅ نمره و بازخورد با موفقیت ثبت شد!');
      closeModal();
      // Reload submissions to show updated status
      loadSubmissions(currentTask.id, document.getElementById('pageTitle').textContent, currentTask.maxScore);
    } else {
      alert('❌ خطا: ' + (data.message || 'مشکلی پیش آمد'));
    }
    } catch (err) {
    alert('❌ خطا در ارتباط با سرور');
  }
  
  btn.disabled = false;
  btn.textContent = 'ثبت نمره و بازخورد';
}

// Initialize
loadTasks();
</script>
</body>
</html>
