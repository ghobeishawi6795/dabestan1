<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بررسی تکالیف دانش‌آموزان</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        .submission-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff;
        }
        .submission-card .student-name {
            font-weight: bold;
            color: #1976d2;
        }
        .submission-card .answer {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .submission-card .review-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .submission-card .review-actions input, 
        .submission-card .review-actions textarea {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .submission-card .review-actions button {
            padding: 5px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .btn-save-review { background: #4caf50; }
        .btn-request-revision { background: #ff9800; }
        .btn-approved { background: #2196f3; }
        .status-pending { color: #ff9800; }
        .status-reviewed { color: #4caf50; }
        .status-revised { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 بررسی تکالیف</h1>
        <div class="filters">
            <label>انتخاب تکلیف:</label>
            <select id="task-select">
                <option value="">ابتدا تکلیف را انتخاب کنید...</option>
            </select>
        </div>
        <div id="submissions-container"></div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert('لطفاً وارد شوید');
            window.location.href = '/login.html';
        }

        // بارگذاری لیست تکالیف معلم
        async function loadTasks() {
            const res = await fetch('/api/teacher/get-tasks?class_id=1', { // کلاس ۱ پیش‌فرض
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const tasks = await res.json();
            const select = document.getElementById('task-select');
            tasks.forEach(task => {
                const option = document.createElement('option');
                option.value = task.id;
                option.textContent = task.title + ' (کلاس ' + task.class_id + ')';
                select.appendChild(option);
            });
        }

        // بارگذاری پاسخ‌های یک تکلیف
        async function loadSubmissions(taskId) {
            const res = await fetch(`/api/teacher/get-submissions?task_id=${taskId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const submissions = await res.json();
            renderSubmissions(submissions);
        }

        function renderSubmissions(submissions) {
            const container = document.getElementById('submissions-container');
            container.innerHTML = '';
            if (submissions.length === 0) {
                container.innerHTML = '<p>هیچ پاسخی برای این تکلیف ثبت نشده است.</p>';
                return;
            }

            submissions.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'submission-card';
                card.innerHTML = `
                    <div class="student-name">👤 ${sub.student_name || 'دانش‌آموز'}</div>
                    <div class="answer">
                        <strong>پاسخ:</strong><br>
                        ${sub.answer_text || 'پاسخ فایل ارسال شده: ' + (sub.answer_file_url || '')}
                    </div>
                    <div>
                        <strong>وضعیت:</strong> <span class="status-${sub.status}">${sub.status === 'pending' ? 'در انتظار بررسی' : sub.status === 'reviewed' ? 'بررسی شده' : 'درخواست اصلاح'}</span>
                        ${sub.score !== null ? ` | <strong>نمره:</strong> ${sub.score}` : ''}
                        ${sub.feedback ? ` | <strong>بازخورد:</strong> ${sub.feedback}` : ''}
                    </div>
                    <div class="review-actions">
                        <input type="number" id="score-${sub.id}" placeholder="نمره" value="${sub.score || 0}" style="width:80px;">
                        <textarea id="feedback-${sub.id}" placeholder="بازخورد" rows="2" style="flex:1;">${sub.feedback || ''}</textarea>
                        <button class="btn-save-review" data-id="${sub.id}">💾 ذخیره نمره و بازخورد</button>
                        <button class="btn-request-revision" data-id="${sub.id}">↩️ درخواست اصلاح</button>
                        <button class="btn-approved" data-id="${sub.id}">✅ تأیید نهایی</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // رویدادها
            document.querySelectorAll('.btn-save-review').forEach(btn => {
                btn.addEventListener('click', () => saveReview(btn.dataset.id));
            });
            document.querySelectorAll('.btn-request-revision').forEach(btn => {
                btn.addEventListener('click', () => requestRevision(btn.dataset.id));
            });
            document.querySelectorAll('.btn-approved').forEach(btn => {
                btn.addEventListener('click', () => approveSubmission(btn.dataset.id));
            });
        }

        // ذخیره نمره و بازخورد
        async function saveReview(submissionId) {
            const score = document.getElementById(`score-${submissionId}`).value;
            const feedback = document.getElementById(`feedback-${submissionId}`).value;
            
            const res = await fetch('/api/teacher/review-submission', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ submission_id: submissionId, score, feedback, status: 'reviewed' })
            });
            
            if (res.ok) {
                alert('✅ بازخورد و نمره ذخیره شد');
                // بارگذاری مجدد
                const taskId = document.getElementById('task-select').value;
                loadSubmissions(taskId);
            } else {
                alert('❌ خطا در ذخیره');
            }
        }

        // درخواست اصلاح
        async function requestRevision(submissionId) {
            if (!confirm('آیا از درخواست اصلاح برای این پاسخ مطمئن هستید؟')) return;
            
            const res = await fetch('/api/teacher/review-submission', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ submission_id: submissionId, status: 'revised' })
            });
            
            if (res.ok) {
                alert('↩️ درخواست اصلاح ارسال شد');
                const taskId = document.getElementById('task-select').value;
                loadSubmissions(taskId);
            } else {
                alert('❌ خطا در ارسال درخواست');
            }
        }

        // تأیید نهایی
        async function approveSubmission(submissionId) {
            if (!confirm('آیا این پاسخ را تأیید نهایی می‌کنید؟')) return;
            
            const res = await fetch('/api/teacher/review-submission', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ submission_id: submissionId, status: 'reviewed' })
            });
            
            if (res.ok) {
                alert('✅ تأیید نهایی انجام شد');
                const taskId = document.getElementById('task-select').value;
                loadSubmissions(taskId);
            } else {
                alert('❌ خطا در تأیید');
            }
        }

        // رویداد تغییر تکلیف
        document.getElementById('task-select').addEventListener('change', (e) => {
            if (e.target.value) {
                loadSubmissions(e.target.value);
            }
        });

        // اجرا
        loadTasks();
    </script>
</body>
</html>
