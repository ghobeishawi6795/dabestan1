<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات تکلیف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 20px; min-height: 100%; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .back-btn svg { width: 20px; height: 20px; color: var(--text-2); }
  .page-title { flex: 1; min-width: 0; }
  .page-title h1 { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: var(--text-1); }
  .page-title p { margin: 0; font-size: 12px; color: var(--muted); }

  .info-card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .info-value { font-size: 14px; font-weight: 700; color: var(--text-1); }

  .questions-card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .questions-card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 800; color: var(--text-1); display: flex; align-items: center; gap: 8px; }

  /* استایل محتوای تعاملی سوالات */
  .task-question-block {
    background: var(--bg);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    border: 1.5px solid var(--border);
  }
  .task-question-block h4 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
  }
  .interactive-content {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-1);
  }
  .interactive-content button,
  .interactive-content .option-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 4px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .interactive-content button:active,
  .interactive-content .option-btn:active {
    transform: scale(0.95);
  }
  .interactive-content input[type="text"],
  .interactive-content input[type="number"] {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 14px;
    width: 100%;
    max-width: 200px;
    box-sizing: border-box;
  }
  .interactive-content .option-btn.selected {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
  }
  .interactive-content .feedback {
    display: block;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    background: var(--bg);
  }

  .answer-card { background: var(--card); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .answer-card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 800; color: var(--text-1); }
  .answer-card textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    box-sizing: border-box;
  }
  .answer-card textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), #8B7CF6);
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
  }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .status-submitted { background: var(--success-soft); color: #15803D; }
  .status-reviewed { background: var(--primary-soft); color: var(--primary); }
  .status-revision { background: var(--danger-soft); color: var(--danger); }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .error { text-align: center; padding: 40px; color: var(--danger); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <a href="student-home.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="page-title">
        <h1 id="taskTitle">بارگذاری...</h1>
        <p id="taskMeta">در حال دریافت اطلاعات</p>
      </div>
    </div>

    <div id="taskContent">
      <div class="loading">در حال بارگذاری تکلیف...</div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
const token = localStorage.getItem('token');

if (!user || user.role !== 'student') {
  window.location.href = 'login.html?role=student';
}

// دریافت ID تکلیف از URL
const urlParams = new URLSearchParams(window.location.search);
const taskId = urlParams.get('id');

if (!taskId) {
  document.getElementById('taskContent').innerHTML = '<div class="error">شناسه تکلیف مشخص نیست</div>';
}

async function loadTask() {
  const contentDiv = document.getElementById('taskContent');
  
  try {
    const res = await fetch(`/api/student/get-task-detail?id=${taskId}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();

    if (!data.success || !data.task) {
      contentDiv.innerHTML = '<div class="error">تکلیف یافت نشد</div>';
      return;
    }

    const task = data.task;

    // به‌روزرسانی عنوان و متا
    document.getElementById('taskTitle').textContent = task.title;
    document.getElementById('taskMeta').textContent = `${task.subject || 'عمومی'} • پایه ${task.grade || '-'}`;

    // ساخت HTML کامل صفحه
    let html = '';

    // کارت اطلاعات تکلیف
    html += `
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">📚 درس:</span>
          <span class="info-value">${task.subject || 'عمومی'}</span>
        </div>
        <div class="info-row">
          <span class="info-label">🎓 پایه:</span>
          <span class="info-value">${task.grade || '-'}</span>
        </div>
        <div class="info-row">
          <span class="info-label">👩‍🏫 معلم:</span>
          <span class="info-value">${task.teacher_name || '-'}</span>
        </div>
        <div class="info-row">
          <span class="info-label">⏰ مهلت:</span>
          <span class="info-value">${task.deadline ? new Date(task.deadline).toLocaleDateString('fa-IR') : 'بدون مهلت'}</span>
        </div>
        <div class="info-row">
          <span class="info-label">📝 نوع پاسخ:</span>
          <span class="info-value">متنی</span>
        </div>
        ${task.status ? `
        <div class="info-row">
          <span class="info-label">وضعیت:</span>
          <span class="status-badge status-${task.status}">${
            task.status === 'submitted' ? 'ارسال شده' :
            task.status === 'reviewed' ? 'بررسی شده' :
            task.status === 'revision' ? 'نیاز به اصلاح' : 'جدید'
          }</span>
        </div>` : ''}
      </div>
    `;

    // کارت سوالات (مهم‌ترین بخش - استفاده از innerHTML)
    if (task.description && task.description.trim()) {
      html += `
        <div class="questions-card">
          <h2>✏️ سوالات تکلیف</h2>
          <div class="interactive-content">
            ${task.description}
          </div>
        </div>
      `;
    } else {
      html += `
        <div class="questions-card">
          <h2>✏️ سوالات تکلیف</h2>
          <p style="color: var(--muted); font-size: 14px;">توضیحات تکلیف موجود نیست.</p>
        </div>
      `;
    }

    // کارت پاسخ دانش‌آموز
    const isSubmitted = task.status && task.status !== 'new';
    html += `
      <div class="answer-card">
        <h2>📤 پاسخ شما</h2>
        ${isSubmitted ? `
          <div style="background: var(--bg); padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap;">
            ${task.my_answer || 'پاسخی ثبت نشده'}
          </div>
          ${task.score !== null && task.score !== undefined ? `
            <div style="margin-top: 12px; padding: 12px; background: var(--primary-soft); border-radius: 12px;">
              <div style="font-size: 13px; color: var(--primary); font-weight: 700; margin-bottom: 4px;">نمره: ${task.score} از ${task.max_score || 20}</div>
              ${task.feedback ? `<div style="font-size: 13px; color: var(--text-1); margin-top: 8px;"><strong>بازخورد:</strong><br>${task.feedback}</div>` : ''}
            </div>
          ` : ''}
        ` : `
          <textarea id="answerText" placeholder="پاسخ خود را اینجا بنویسید..."></textarea>
          <button class="submit-btn" id="submitBtn" style="margin-top: 12px;">ارسال پاسخ</button>
        `}
      </div>
    `;

    contentDiv.innerHTML = html;

    // اتصال رویداد دکمه ارسال
    if (!isSubmitted) {
      const submitBtn = document.getElementById('submitBtn');
      const answerText = document.getElementById('answerText');
      
      if (submitBtn && answerText) {
        submitBtn.addEventListener('click', async () => {
          const answer = answerText.value.trim();
          if (!answer) {
            alert('لطفاً پاسخ خود را وارد کنید');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'در حال ارسال...';

          try {
            const res = await fetch('/api/student/submit-task', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({
                taskId: parseInt(taskId),
                answer: answer
              })
            });

            const data = await res.json();
            if (data.success) {
              alert('✅ پاسخ شما با موفقیت ارسال شد');
              window.location.reload();
            } else {
              alert('❌ ' + (data.message || 'خطا در ارسال'));
              submitBtn.disabled = false;
              submitBtn.textContent = 'ارسال پاسخ';
            }
          } catch (err) {
            alert('❌ خطای شبکه: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'ارسال پاسخ';
          }
        });
      }
    }

  } catch (err) {
    console.error('Load task error:', err);
    contentDiv.innerHTML = '<div class="error">خطا در دریافت تکلیف: ' + err.message + '</div>';
  }
}

loadTask();
</script>
</body>
  </html>
