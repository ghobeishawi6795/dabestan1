<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمرات من - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 24px; min-height: 100%; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .header h2 { font-size: 18px; font-weight: 800; margin: 0; flex: 1; }

  .summary-card { background: linear-gradient(135deg, var(--primary), #8B7CF6); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; color: white; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .summary-item { background: rgba(255,255,255,.15); border-radius: 12px; padding: 14px; backdrop-filter: blur(10px); text-align: center; }
  .summary-value { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .summary-label { font-size: 11px; opacity: .9; margin: 0; }

  .grade-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
  .grade-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .grade-title { font-size: 15px; font-weight: 700; margin: 0; }
  .grade-sub { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .grade-score { font-size: 16px; font-weight: 800; color: var(--primary); }
  .grade-status { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-top: 8px; }
  .grade-status.reviewed { background: #DCFCE7; color: #15803D; }
  .grade-status.revision { background: #FEF3C7; color: #B45309; }
  .grade-status.submitted { background: #E0E7FF; color: #4338CA; }
  .grade-feedback { margin-top: 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; font-size: 13px; line-height: 1.7; }

  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 8px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <div class="back-btn" onclick="window.location.href='student-home.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <h2>📊 نمرات من</h2>
    </div>

    <div class="summary-card">
      <div class="summary-grid">
        <div class="summary-item">
          <p class="summary-value" id="summaryReviewed">-</p>
          <p class="summary-label">بررسی‌شده</p>
        </div>
        <div class="summary-item">
          <p class="summary-value" id="summaryAvg">-</p>
          <p class="summary-label">میانگین نمره</p>
        </div>
      </div>
    </div>

    <div id="gradesContainer" class="loading">در حال بارگذاری...</div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
const token = localStorage.getItem('token');

const statusLabels = {
  reviewed: 'بررسی‌شده',
  revision: 'نیاز به اصلاح',
  submitted: 'منتظر بررسی'
};

async function loadGrades() {
  const container = document.getElementById('gradesContainer');
  try {
    const res = await fetch('/api/student/get-submissions', { headers: { 'Authorization': 'Bearer ' + token } });
    const data = await res.json();

    if (!data.success) {
      container.innerHTML = `<div class="empty-state"><p>${data.message || 'خطا در دریافت نمرات'}</p></div>`;
      return;
    }

    const submissions = data.submissions || [];
    const reviewed = submissions.filter(s => s.status === 'reviewed' && s.score != null);
    document.getElementById('summaryReviewed').textContent = reviewed.length.toLocaleString('fa-IR');
    if (reviewed.length > 0) {
      const avgPct = reviewed.reduce((sum, s) => sum + (s.score / (s.max_score || 20)) * 100, 0) / reviewed.length;
      document.getElementById('summaryAvg').textContent = Math.round(avgPct).toLocaleString('fa-IR') + '%';
    } else {
      document.getElementById('summaryAvg').textContent = '-';
    }

    if (submissions.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="emoji">📭</div>
          <p>هنوز تکلیفی ارسال نکرده‌ای</p>
        </div>
      `;
      return;
    }

    container.innerHTML = submissions.map(s => `
      <div class="grade-card">
        <div class="grade-head">
          <div>
            <p class="grade-title">${s.title || 'تکلیف'}</p>
            <p class="grade-sub">${s.subject || ''}</p>
          </div>
          ${s.status === 'reviewed' && s.score != null ? `<div class="grade-score">${s.score} از ${s.max_score || 20}</div>` : ''}
        </div>
        <span class="grade-status ${s.status}">${statusLabels[s.status] || s.status}</span>
        ${s.feedback ? `<div class="grade-feedback">💬 ${s.feedback}</div>` : ''}
      </div>
    `).join('');

  } catch (err) {
    container.innerHTML = '<div class="empty-state"><p>خطا در ارتباط با سرور</p></div>';
  }
}

loadGrades();
</script>
</body>
</html>
