<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد دانش‌آموز - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 24px; min-height: 100%; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .user-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #8B7CF6); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
  .user-info { flex: 1; }
  .user-name { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
  .user-role { font-size: 12px; color: var(--muted); margin: 0; }
  .logout-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .logout-btn:hover { border-color: var(--danger); }
  .logout-btn svg { width: 20px; height: 20px; color: var(--danger); }
  
  .stats-card { background: linear-gradient(135deg, var(--primary), #8B7CF6); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; color: white; }
  .stats-title { font-size: 18px; font-weight: 800; margin: 0 0 8px; }
  .stats-subtitle { font-size: 13px; opacity: .9; margin: 0 0 20px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-item { background: rgba(255,255,255,.15); border-radius: 12px; padding: 14px; backdrop-filter: blur(10px); }
  .stat-value { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
  .stat-label { font-size: 12px; opacity: .9; margin: 0; }
  
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  
  .task-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all .2s; }
  .task-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(108,92,231,.15); }
  .task-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .task-title { font-size: 15px; font-weight: 700; margin: 0; flex: 1; }
  .task-badge { padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; margin-right: 8px; }
  .task-badge.new { background: #DCFCE7; color: #15803D; }
  .task-badge.urgent { background: #FEE2E2; color: #DC2626; }
  .task-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .task-meta-item { display: flex; align-items: center; gap: 4px; }
  .task-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
  .task-teacher { font-size: 12px; color: var(--muted); }
  .task-action { font-size: 12px; font-weight: 700; color: var(--primary); }
  
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 8px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  
  .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .action-btn { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: all .2s; text-decoration: none; color: inherit; }
  .action-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
  .action-icon { font-size: 28px; margin-bottom: 8px; }
  .action-label { font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <div class="user-avatar" id="userAvatar">د</div>
      <div class="user-info">
        <h2 class="user-name" id="userName">دانش‌آموز</h2>
        <p class="user-role" id="userClass">کلاس -</p>
      </div>
      <div class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
    </div>

    <div class="stats-card">
      <h3 class="stats-title" id="welcomeMsg">خوش آمدی! 👋</h3>
      <p class="stats-subtitle" id="statsSubtitle">در حال بارگذاری...</p>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="statPending">-</div>
          <div class="stat-label">تکلیف در انتظار</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statDone">-</div>
          <div class="stat-label">تکلیف انجام شده</div>
        </div>
      </div>
    </div>

    <div class="quick-actions">
      <a href="student-task.html" class="action-btn">
        <div class="action-icon"></div>
        <div class="action-label">تکالیف من</div>
      </a>
      <a href="#" class="action-btn">
        <div class="action-icon">📊</div>
        <div class="action-label">نمرات من</div>
      </a>
    </div>

    <h3 class="section-title">📋 تکالیف جدید</h3>
    <div id="tasksList">
      <div class="loading">در حال بارگذاری تکالیف...</div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');

if (!user || user.role !== 'student') {
  window.location.href = 'login.html?role=student';
}

// نمایش اطلاعات کاربر
document.getElementById('userName').textContent = user.name || 'دانش‌آموز';
document.getElementById('userAvatar').textContent = (user.name || 'د')[0];
document.getElementById('userClass').textContent = `پایه ${user.grade || '-'} | کلاس ${user.class || '-'}`;
document.getElementById('welcomeMsg').textContent = `سلام ${user.name || 'دانش‌آموز'}! 👋`;

function logout() {
  localStorage.removeItem('user');
  window.location.href = 'index.html';
}

async function loadTasks() {
  const list = document.getElementById('tasksList');
  const subtitle = document.getElementById('statsSubtitle');
  
  try {
    const res = await fetch(`/api/student/get-tasks?studentId=${user.id}`);
    const data = await res.json();
    
    if (data.success && data.tasks.length > 0) {
      subtitle.textContent = `${data.tasks.length} تکلیف فعال داری`;
      document.getElementById('statPending').textContent = data.tasks.length;
      document.getElementById('statDone').textContent = '0';
      
      list.innerHTML = data.tasks.map(task => {
        const deadline = task.deadline ? new Date(task.deadline).toLocaleString('fa-IR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'بدون مهلت';
        const isUrgent = task.deadline && (new Date(task.deadline) - new Date() < 24 * 60 * 60 * 1000);
        
        return `
          <div class="task-card" onclick="openTask(${task.id})">
            <div class="task-header">
              <h4 class="task-title">${task.title}</h4>
              <span class="task-badge ${isUrgent ? 'urgent' : 'new'}">${isUrgent ? 'فوری' : 'جدید'}</span>
            </div>
            <div class="task-meta">
              <div class="task-meta-item"> ${task.subject || '-'}</div>
              <div class="task-meta-item">🎓 پایه ${task.grade || '-'}</div>
              <div class="task-meta-item">⏰ ${deadline}</div>
            </div>
            <div class="task-footer">
              <div class="task-teacher">👨‍🏫 ${task.teacher_name || 'معلم'}</div>
              <div class="task-action">مشاهده و انجام ←</div>
            </div>
          </div>
        `;
      }).join('');
    } else {
      subtitle.textContent = 'تکلیفی نداری! ';
      document.getElementById('statPending').textContent = '0';
      document.getElementById('statDone').textContent = '0';
      list.innerHTML = `
        <div class="empty-state">
          <div class="emoji">🎉</div>
          <p>تکلیف جدیدی نداری!</p>
        </div>
      `;
    }
  } catch (err) {
    list.innerHTML = '<div class="empty-state"><p>خطا در بارگذاری تکالیف</p></div>';
    console.error('Error loading tasks:', err);
  }
}

function openTask(id) {
  window.location.href = `student-task-detail.html?id=${id}`;
}

loadTasks();
</script>
</body>
      </html>
