<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایجاد تکلیف جدید</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        .question-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
        }
        .question-item {
            padding: 8px;
            margin-bottom: 5px;
            background: #f9f9f9;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .question-item:hover {
            background: #e3f2fd;
        }
        .question-item.selected {
            background: #bbdefb;
            border: 2px solid #1976d2;
        }
        #selected-question-area {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 ایجاد تکلیف جدید</h1>
        
        <form id="task-form">
            <div class="form-group">
                <label>عنوان تکلیف</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>توضیحات</label>
                <textarea id="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>کلاس</label>
                <select id="class_id" required>
                    <option value="">انتخاب کلاس...</option>
                    <!-- توسط جاوااسکریپت پر می‌شود -->
                </select>
            </div>
            <div class="form-group">
                <label>نمره کل</label>
                <input type="number" id="grade" value="0">
            </div>
            <div class="form-group">
                <label>نوع پاسخ</label>
                <select id="answer_type">
                    <option value="text">متنی</option>
                    <option value="file">فایل</option>
                    <option value="choice">چندگزینه‌ای</option>
                </select>
            </div>
            <div class="form-group">
                <label>حداکثر نمره</label>
                <input type="number" id="max_score" value="100">
            </div>
            <div class="form-group">
                <label>مهلت ارسال</label>
                <input type="datetime-local" id="deadline">
            </div>
            
            <!-- بخش بانک سؤال -->
            <hr>
            <h3>📚 انتخاب سؤال از بانک</h3>
            <button type="button" id="load-questions-btn" class="btn btn-secondary">بارگذاری سؤال‌ها</button>
            <div id="question-list-container" style="display:none;">
                <div class="question-list" id="question-list"></div>
                <button type="button" id="add-question-btn" class="btn btn-primary" disabled>افزودن سؤال انتخاب‌شده به تکلیف</button>
            </div>
            <div id="selected-question-area">
                <strong>سؤال انتخاب شده:</strong>
                <p id="selected-question-text"></p>
            </div>

            <button type="submit" class="btn btn-success" style="margin-top:20px;">ایجاد تکلیف</button>
        </form>
    </div>

    <script>
        // دریافت توکن از localStorage (بعد از ورود)
        const token = localStorage.getItem('token');
        if (!token) {
            alert('لطفاً ابتدا وارد شوید');
            window.location.href = '/login.html';
        }

        let selectedQuestion = null;

        // بارگذاری کلاس‌ها (با استفاده از API)
        async function loadClasses() {
            const res = await fetch('/api/teacher/get-classes', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const select = document.getElementById('class_id');
            data.forEach(cls => {
                const option = document.createElement('option');
                option.value = cls.id;
                option.textContent = cls.name;
                select.appendChild(option);
            });
        }

        // بارگذاری سؤال‌ها از بانک
        document.getElementById('load-questions-btn').addEventListener('click', async () => {
            const container = document.getElementById('question-list-container');
            container.style.display = 'block';
            
            const res = await fetch('/api/teacher/get-questions', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const questions = await res.json();
            
            const list = document.getElementById('question-list');
            list.innerHTML = '';
            questions.forEach(q => {
                const div = document.createElement('div');
                div.className = 'question-item';
                div.textContent = q.question_text;
                div.dataset.id = q.id;
                div.addEventListener('click', () => {
                    // حذف انتخاب قبلی
                    document.querySelectorAll('.question-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedQuestion = q;
                    document.getElementById('add-question-btn').disabled = false;
                    document.getElementById('selected-question-area').style.display = 'block';
                    document.getElementById('selected-question-text').textContent = q.question_text;
                });
                list.appendChild(div);
            });
        });

        // افزودن سؤال به فرم
        document.getElementById('add-question-btn').addEventListener('click', () => {
            if (selectedQuestion) {
                const desc = document.getElementById('description');
                desc.value += (desc.value ? '\n\n' : '') + '📌 سؤال از بانک: ' + selectedQuestion.question_text;
                alert('✅ سؤال به توضیحات تکلیف اضافه شد');
                document.getElementById('selected-question-area').style.display = 'none';
                document.getElementById('add-question-btn').disabled = true;
            }
        });

        // ارسال فرم
        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                class_id: parseInt(document.getElementById('class_id').value),
                grade: parseInt(document.getElementById('grade').value) || 0,
                answer_type: document.getElementById('answer_type').value,
                max_score: parseInt(document.getElementById('max_score').value) || 100,
                is_active: 1,
                deadline: document.getElementById('deadline').value || null
            };

            const res = await fetch('/api/teacher/create-task', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(formData)
            });

            const result = await res.json();
            if (res.ok) {
                alert('✅ تکلیف با موفقیت ایجاد شد!');
                window.location.href = '/teacher-dashboard.html';
            } else {
                alert('❌ خطا: ' + result.error);
            }
        });

        // اجرای اولیه
        loadClasses();
    </script>
</body>
  </html>
