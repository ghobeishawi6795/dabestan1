<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>داشبورد دانش‌آموز - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 24px; min-height: 100%; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; animation: fadeUp .5s var(--ease) both; }
  .user-info { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #8B7CF6); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; box-shadow: 0 4px 12px rgba(108,92,231,.3); }
  .user-text h2 { margin: 0 0 2px; font-size: 16px; font-weight: 700; }
  .user-text p { margin: 0; font-size: 12px; color: var(--muted); }
  .logout-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--danger); }
  .logout-btn:hover { border-color: var(--danger); background: var(--danger-soft); }
  .logout-btn svg { width: 20px; height: 20px; }
  .welcome-card { background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; color: white; box-shadow: 0 12px 24px rgba(139,92,246,.3); animation: fadeUp .5s var(--ease) .1s both; text-align: center; }
  .welcome-card h2 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
  .welcome-card p { margin: 0; font-size: 13px; opacity: .9; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat-item { background: rgba(255,255,255,.2); backdrop-filter: blur(10px); border-radius: 14px; padding: 14px; text-align: center; }
  .stat-value { font-size: 22px; font-weight: 800; margin: 0 0 2px; }
  .stat-label { font-size: 11px; opacity: .9; margin: 0; }
  .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .section-title a { font-size: 12px; color: var(--primary); text-decoration: none; }
  .task-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; animation: fadeUp .5s var(--ease) both; }
  .task-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .task-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .task-info { flex: 1; }
  .task-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .task-subject { font-size: 12px; color: var(--muted); margin: 0; }
  .task-meta { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .task-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #8B7CF6); color: white; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .empty-state { text-align: center; padding: 32px 16px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 8px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <div class="user-info">
        <div class="avatar" id="userAvatar">د</div>
        <div class="user-text">
          <h2 id="userName">دانش‌آموز</h2>
          <p id="userClass">کلاس</p>
        </div>
      </div>
      <div class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
    </div>

    <div class="welcome-card">
      <h2 id="welcomeText">آماده‌ای تکالیفت رو انجام بدی؟ 🚀</h2>
      <p>بیا شروع کنیم!</p>
      <div class="stats-row">
        <div class="stat-item">
          <p class="stat-value" id="taskCount">0</p>
          <p class="stat-label">تکلیف امروز</p>
        </div>
        <div class="stat-item">
          <p class="stat-value">⭐</p>
          <p class="stat-label">ستاره‌های من</p>
        </div>
      </div>
    </div>

    <div class="section-title">
      <h3>تکالیف امروز</h3>
      <a href="#">مشاهده همه</a>
    </div>

    <div id="tasksList">
      <div class="empty-state">
        <div class="emoji"></div>
        <p>هنوز تکلیفی برای امروز ثبت نشده</p>
      </div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');

if (user.name) {
  document.getElementById('userName').textContent = user.name + ' جان';
  document.getElementById('userAvatar').textContent = user.name.charAt(0);
  document.getElementById('welcomeText').textContent = user.name + ' جان، آماده‌ای تکالیفت رو انجام بدی؟ 🚀';
}

if (user.role === 'student') {
  document.getElementById('userClass').textContent = 'دانش‌آموز';
}

function logout() {
  if (confirm('آیا می‌خواهید خارج شوید؟')) {
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }
}
</script>
</body>
</html>
