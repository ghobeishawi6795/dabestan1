<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدیریت تکالیف - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .screen { padding: 24px; min-height: 100%; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .back-btn:hover { border-color: var(--primary); transform: translateX(4px); }
  .back-btn svg { width: 20px; height: 20px; color: var(--text-2); }
  .page-title { flex: 1; }
  .page-title h1 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .page-title p { margin: 0; font-size: 12px; color: var(--muted); }
  .filter-bar { background: var(--card); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 20px; }
  .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .field select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); font-family: inherit; font-size: 13px; }
  .task-list { margin-top: 20px; }
  .task-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
  .task-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .task-title { font-size: 15px; font-weight: 700; margin: 0; }
  .task-status { padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .task-status.active { background: #DCFCE7; color: #15803D; }
  .task-status.inactive { background: #fee; color: #c00; }
  .task-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .task-actions { display: flex; gap: 8px; }
  .btn-small { padding: 8px 16px; border: none; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-view { background: var(--primary-soft); color: var(--primary); }
  .btn-edit { background: #FEF3C7; color: #B45309; }
  .btn-delete { background: var(--danger-soft); color: var(--danger); }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="header">
      <div class="back-btn" onclick="window.location.href='teacher-home.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="page-title">
        <h1>مدیریت تکالیف</h1>
        <p>مشاهده و مدیریت تکالیف ارسال شده</p>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-row">
        <div class="field">
          <label>فیلتر بر اساس درس</label>
          <select id="filterSubject" onchange="loadTasks()">
            <option value="all">همه دروس</option>
            <option value="ریاضی">ریاضی</option>
            <option value="فارسی">فارسی</option>
            <option value="علوم">علوم</option>
            <option value="مطالعات اجتماعی">مطالعات اجتماعی</option>
            <option value="هدیه‌های آسمانی">هدیه‌های آسمانی</option>
            <option value="قرآن">قرآن</option>
          </select>
        </div>
        <div class="field">
          <label>فیلتر بر اساس پایه</label>
          <select id="filterGrade" onchange="loadTasks()">
            <option value="all">همه پایه‌ها</option>
            <option value="1">اول ابتدایی</option>
            <option value="2">دوم ابتدایی</option>
            <option value="3">سوم ابتدایی</option>
            <option value="4">چهارم ابتدایی</option>
            <option value="5">پنجم ابتدایی</option>
            <option value="6">ششم ابتدایی</option>
          </select>
        </div>
      </div>
    </div>

    <div id="tasksList" class="task-list">
      <div class="empty-state">
        <div class="emoji">📭</div>
        <p>در حال بارگذاری...</p>
      </div>
    </div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('user') || '{}');
const teacherId = user.id || 1;

async function loadTasks() {
  const list = document.getElementById('tasksList');
  const subject = document.getElementById('filterSubject').value;
  const grade = document.getElementById('filterGrade').value;
  
  try {
    let url = `/api/teacher/get-tasks?teacherId=${teacherId}&limit=100`;
    if (subject !== 'all') url += `&subject=${subject}`;
    if (grade !== 'all') url += `&grade=${grade}`;
    
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.success && data.tasks.length > 0) {
      list.innerHTML = data.tasks.map(task => {
        const deadline = task.deadline ? new Date(task.deadline).toLocaleString('fa-IR') : 'ندارد';
        return `
          <div class="task-card">
            <div class="task-header">
              <h4 class="task-title">${task.title}</h4>
              <span class="task-status ${task.is_active ? 'active' : 'inactive'}">${task.is_active ? 'فعال' : 'غیرفعال'}</span>
            </div>
            <div class="task-meta">
              <span>📚 ${task.subject || '-'}</span>
              <span> پایه ${task.grade || '-'}</span>
              <span>🏫 ${task.class_name || '-'} ${task.class_grade ? '(' + task.class_grade + ')' : ''}</span>
              <span>⏰ مهلت: ${deadline}</span>
              <span>📝 نوع پاسخ: ${task.answer_type || 'متنی'}</span>
              <span>⭐ نمره: ${task.max_score || 20}</span>
            </div>
            <div class="task-actions">
              <button class="btn-small btn-view" onclick="viewTask(${task.id})">مشاهده</button>
              <button class="btn-small btn-edit" onclick="editTask(${task.id})">ویرایش</button>
              <button class="btn-small btn-delete" onclick="deleteTask(${task.id})">حذف</button>
            </div>
          </div>
        `;
      }).join('');
    } else {
      list.innerHTML = `
        <div class="empty-state">
          <div class="emoji">📭</div>
          <p>تکلیفی یافت نشد</p>
        </div>
      `;
    }
  } catch (err) {
    list.innerHTML = '<div class="empty-state"><p>خطا در بارگذاری تکالیف</p></div>';
  }
}

function viewTask(id) {
  alert('نمایش جزئیات تکلیف ' + id + '\n(در نسخه بعدی)');
}

function editTask(id) {
  alert('ویرایش تکلیف ' + id + '\n(در نسخه بعدی)');
}

function deleteTask(id) {
  if (confirm('آیا از حذف این تکلیف اطمینان دارید؟')) {
    alert('تکلیف حذف شد (در نسخه بعدی)');
    loadTasks();
  }
}

// بارگذاری اولیه
loadTasks();
</script>
</body>
</html>
