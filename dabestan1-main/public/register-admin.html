<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ثبت‌نام مدیر - دبستان</title>
<style>
  body {
    font-family: Vazirmatn, sans-serif;
    background: linear-gradient(135deg, #6C5CE7 0%, #8B7CF6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 400px;
  }
  h1 {
    text-align: center;
    color: #6C5CE7;
    margin-bottom: 10px;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 14px;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #333;
  }
  input {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #6C5CE7;
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6C5CE7 0%, #8B7CF6 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 10px;
  }
  button:active {
    transform: scale(0.98);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
  }
  .success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  .error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  .code {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 10px 0;
    padding: 10px;
    background: white;
    border-radius: 8px;
    display: inline-block;
  }
</style>
</head>
<body>

<div class="card">
  <h1> ثبت‌نام مدیر مدرسه</h1>
  <div class="subtitle">اولین کاربر سیستم دبستان</div>
  
  <form id="registerForm">
    <div class="field">
      <label>نام مدرسه</label>
      <input type="text" id="schoolName" placeholder="مثلاً: دبستان شهید باهنر" required />
    </div>
    
    <div class="field">
      <label>نام مدیر</label>
      <input type="text" id="adminName" placeholder="مثلاً: آقای محمدی" required />
    </div>
    
    <div class="field">
      <label>شماره موبایل</label>
      <input type="tel" id="phone" placeholder="09123456789" required />
    </div>
    
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="password" placeholder="حداقل  کاراکتر" required minlength="6" />
    </div>
    
    <button type="submit" id="submitBtn">ثبت‌نام</button>
  </form>
  
  <div id="result"></div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  
  btn.disabled = true;
  btn.textContent = 'در حال ثبت‌نام...';
  
  try {
    const res = await fetch('/api/auth/register-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        schoolName: document.getElementById('schoolName').value,
        adminName: document.getElementById('adminName').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value
      })
    });
    
    const data = await res.json();
    
    if (data.success) {
      result.className = 'result success';
      result.innerHTML = `
        ✅ ${data.message}<br>
        <div class="code">${data.schoolCode}</div>
        <div style="font-size:12px;margin-top:10px;">
          این کد ورود خودِ شماست (مدیر مدرسه) — همراه با رمز عبوری که انتخاب کردید ذخیره‌اش کنید.
          کد ورود جداگانه‌ی معلم‌ها و دانش‌آموزها رو بعداً از داشبورد مدیر می‌سازید.
        </div>
        <a href="login.html?role=admin" style="display:block;margin-top:16px;text-decoration:none;background:#6C5CE7;color:#fff;padding:12px;border-radius:10px;font-weight:700;">ورود به داشبورد</a>
      `;
    } else {
      result.className = 'result error';
      result.textContent = '❌ ' + data.message;
    }
  } catch (err) {
    result.className = 'result error';
    result.textContent = '❌ خطا: ' + err.message;
  }
  
  btn.disabled = false;
  btn.textContent = 'ثبت‌نام';
});
</script>

</body>
</html>
