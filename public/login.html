<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود - دبستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .login-screen{
    padding:32px 24px;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--text-2);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:8px 0;
    margin-bottom:24px;
    text-decoration:none;
  }
  .back-btn:hover{color:var(--primary);}
  .back-btn svg{
    width:18px;
    height:18px;
    transform:scaleX(-1);
  }
  .login-card{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:28px 24px;
    box-shadow:var(--shadow);
  }
  .login-title{
    margin:0 0 8px;
    font-size:22px;
    font-weight:800;
    text-align:center;
  }
  .login-subtitle{
    margin:0 0 28px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--text-2);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    padding:14px;
    border:1.5px solid var(--border);
    border-radius:14px;
    background:var(--bg);
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    transition:all .2s var(--ease);
    box-sizing:border-box;
  }
  .field input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
    background:var(--card);
  }
  .submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),#8B7CF6);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(108,92,231,.3);
    transition:all .2s var(--ease);
    margin-top:8px;
  }
  .submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(108,92,231,.4);
  }
  .submit-btn:active{
    transform:scale(.98);
  }
  .submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
  }
  .result{
    margin-top:16px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    text-align:center;
  }
  .result.error{
    background:var(--danger-soft);
    color:var(--danger);
  }
  .result.success{
    background:var(--success-soft);
    color:#15803D;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="login-screen">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      بازگشت
    </a>

    <div class="login-card">
      <h1 class="login-title" id="loginTitle">ورود</h1>
      <p class="login-subtitle" id="loginSubtitle">کد ورود و رمز عبور را وارد کنید</p>
      
      <form id="loginForm">
        <div class="field">
          <label>کد ورود</label>
          <input type="text" id="inviteCode" placeholder="مثلاً: ADMIN001" required />
        </div>
        
        <div class="field">
          <label>رمز عبور</label>
          <input type="password" id="password" placeholder="رمز عبور" required />
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">ورود</button>
      </form>
      
      <div id="result"></div>
    </div>
  </div>

</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role');

const roleNames = {
  'admin': 'مدیر مدرسه',
  'teacher': 'معلم',
  'student': 'دانش‌آموز'
};

if (role && roleNames[role]) {
  document.getElementById('loginTitle').textContent = 'ورود ' + roleNames[role];
  document.getElementById('loginSubtitle').textContent = 'کد ورود و رمز عبور خود را وارد کنید';
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  
  btn.disabled = true;
  btn.textContent = 'در حال ورود...';
  result.innerHTML = '';
  
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        inviteCode: document.getElementById('inviteCode').value,
        password: document.getElementById('password').value
      })
    });
    
    const data = await res.json();
    
    if (data.success) {
      localStorage.setItem('user', JSON.stringify(data.user));
      result.className = 'result success';
      result.textContent = '✅ ورود موفق! در حال انتقال...';
      
      setTimeout(() => {
        if (data.user.role === 'admin') {
          window.location.href = 'admin-home.html';
        } else if (data.user.role === 'teacher') {
          window.location.href = 'teacher-home.html';
        } else if (data.user.role === 'student') {
          window.location.href = 'student-home.html';
        }
      }, 1000);
    } else {
      result.className = 'result error';
      result.textContent = '❌ ' + data.message;
    }
  } catch (err) {
    result.className = 'result error';
    result.textContent = '❌ خطا در اتصال به سرور';
  }
  
  btn.disabled = false;
  btn.textContent = 'ورود';
});
</script>

</body>
</html>
